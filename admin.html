  <script>
    
let lineUid = '';

  const LIFF_ID = '2010317944-82Rv6kVa';

  const GAS_API_URL =
    'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

  const URLS = {
    profile: 'https://liff.line.me/2010317944-48vTQqDt?page=profile'
  };

const HR_BRANCH_ORDER = [
  'HQ',
  'P CL',
  'P LP',
  'P PK',
  'P BN',
  'P R9',
  'P R3',
  'P EV',
  'P FI',
  'P SC',
  'P R2',
  'C LP',
  'C PK',
  'C EV',
  'C R9',
  'C R2',
  'C BN',
  'C CL',
  'C R3'
];

const HR_BRANCH_NAME_MAP = {
  'HQ': 'สำนักงานใหญ่',

  'P CL': 'พิคมี ชิดลม',
  'P LP': 'พิคมี ลาดพร้าว',
  'P PK': 'พิคมี ปิ่นเกล้า',
  'P BN': 'พิคมี บางนา',
  'P R9': 'พิคมี พระราม 9',
  'P R3': 'พิคมี พระราม 3',
  'P EV': 'พิคมี อีสต์วิลล์',
  'P FI': 'พิคมี แฟชั่น',
  'P SC': 'พิคมี สีลม',
  'P R2': 'พิคมี พระราม 2',

  'C LP': 'คาโด้ ลาดพร้าว',
  'C PK': 'คาโด้ ปิ่นเกล้า',
  'C EV': 'คาโด้ อีสต์วิลล์',
  'C R9': 'คาโด้ พระราม 9',
  'C R2': 'คาโด้ พระราม 2',
  'C BN': 'คาโด้ บางนา',
  'C CL': 'คาโด้ ชิดลม',
  'C R3': 'คาโด้ พระราม 3'
};


function getBranchSortIndex(branchId) {
  const idx = HR_BRANCH_ORDER.indexOf(String(branchId || '').trim());
  return idx === -1 ? 999 : idx;
}


function parseDateOnly(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return isNaN(value.getTime())
      ? null
      : new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate(),
          12, 0, 0, 0
        );
  }

  const text = String(value).trim();

  const match = text.match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12, 0, 0, 0
    );
  }

  const fallback = new Date(text);

  return isNaN(fallback.getTime())
    ? null
    : fallback;
}
    

function todayDdMmYyyy() {
  const d = new Date();
  return formatDateDdMmYyyy(d);
}

function formatDateDdMmYyyy(value) {
  if (!value) return '';

  const d = parseDateOnly(value);

  if (!d) {
    return String(value);
  }

  const day =
    String(d.getDate()).padStart(2, '0');

  const month =
    String(d.getMonth() + 1).padStart(2, '0');

  const year =
    d.getFullYear();

  return `${day}/${month}/${year}`;
}
    

function parseDdMmYyyyToIso(str) {
  str = String(str || '').trim();

  const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return '';

  return `${m[3]}-${m[2]}-${m[1]}`;
}

    
async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      lineUid = profile.userId;

      await loadUserAndRenderPortal();

    } catch (err) {
      showError(err.message || err);
    }
  }

    
async function callApi(payload) {
  const action = String(payload && payload.action || '');

  const canRetry =
    action.indexOf('get') === 0;

  const maxAttempts = canRetry ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        redirect: 'follow'
      });

      const text = await res.text();
      const trimmed = String(text || '').trim();

      if (!res.ok) {
        throw new Error(
          'SERVER_HTTP_' + res.status
        );
      }

      if (
        trimmed.charAt(0) === '<' ||
        /^<!doctype html/i.test(trimmed) ||
        /^<html/i.test(trimmed)
      ) {
        console.error(
          'API returned HTML instead of JSON',
          {
            action: action,
            status: res.status,
            response: trimmed.slice(0, 500)
          }
        );

        throw new Error('SERVER_RETURNED_HTML');
      }

      let result;

      try {
        result = JSON.parse(trimmed);
      } catch (parseError) {
        console.error(
          'Invalid API response',
          {
            action: action,
            status: res.status,
            response: trimmed.slice(0, 500)
          }
        );

        throw new Error('INVALID_SERVER_RESPONSE');
      }

      return result;

    } catch (err) {
      lastError = err;

      console.error(
        'API request failed',
        {
          action: action,
          attempt: attempt,
          maxAttempts: maxAttempts,
          error: err
        }
      );

      if (attempt < maxAttempts) {
        await waitBeforeRetry(attempt);
      }
    }
  }

  const errorText =
    String(
      lastError && lastError.message
        ? lastError.message
        : lastError || ''
    );

if (
  errorText === 'SERVER_RETURNED_HTML' ||
  errorText.indexOf('SERVER_HTTP_') === 0 ||
  errorText === 'INVALID_SERVER_RESPONSE' ||
  errorText.indexOf('Failed to fetch') !== -1 ||
  errorText.indexOf('NetworkError') !== -1
) {
  return {
    success: false,
    message:
      'ระบบเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณารอสักครู่แล้วกดลองใหม่'
  };
}

return {
  success: false,
  message:
    errorText ||
    'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'
};
}

function waitBeforeRetry(attempt) {
  const delay =
    attempt === 1
      ? 800
      : 1600;

  return new Promise(function(resolve) {
    setTimeout(resolve, delay);
  });
}

    
async function loadUserAndRenderPortal() {
  showLoading('กำลังตรวจสอบสิทธิ์...');

  const res = await callApi({
    action: 'getCurrentEmployee',
    line_uid: lineUid
  });

  if (!res.success) {
    showError(res.message || 'ไม่พบข้อมูลผู้ใช้งาน');
    return;
  }

  const user = res.employee || res.user || res;
  renderPortalByRole(user);
}


function showLoading(message) {
  document.getElementById('app').innerHTML = `
    <div class="loading">${message || 'กำลังโหลด...'}</div>
  `;
}

    
function renderPortalByRole(user) {
  const role = String(user.role || '').trim().toUpperCase();
  const name = user.nickname || user.first_name || user.employee_code || '';

  if (role === 'MANAGER') {
    renderManagerPortal(name);
    openAdminStartPage(role);
    return;
  }

  if (role === 'OWNER' || role === 'HR') {
    renderAdminPortal(name);
    openAdminStartPage(role);
    return;
  }

  if (role === 'STAFF') {
    window.location.href = 'https://liff.line.me/2010317944-48vTQqDt';
    return;
  }

  showError('คุณไม่มีสิทธิ์ใช้งานหน้านี้');
  }

function getAdminStartPage() {
  const params = new URLSearchParams(window.location.search);
  return String(params.get('page') || 'home').trim().toLowerCase();
}

function openAdminStartPage(role) {
  const page = getAdminStartPage();
  if (page === 'home') return;

  const routes = {
    employees: function() { return renderEmployeeManagementCenter(); },
    approvalemployee: function() { return renderApprovalCenter('employee'); },
    approvalleave: function() { return renderApprovalCenter('leave'); },
    schedule: function() { return renderScheduleCenter(); },
    attendance: function() { return renderAttendanceCenter(); },
    documents: function() { return renderDocumentCenter(); },
    audit: function() { return renderAuditLogViewer(); }
  };

  if (role === 'MANAGER' && ['documents', 'audit'].indexOf(page) !== -1) {
    showError('คุณไม่มีสิทธิ์เปิดเมนูนี้');
    return;
  }

  if (routes[page]) routes[page]();
}

      <div class="sub">สวัสดี ${name || ''} | เมนูสำหรับเจ้าของ / HR</div>

async function renderEmployeeChargeList() {
  const res = await callApi({
    action: 'getEmployeeChargesAdminData',
    line_uid: lineUid
  });

  if (!res.success) {
    alert(res.message || 'โหลดรายการไม่สำเร็จ');
    return;
  }

  const charges = res.charges || [];

  let html = `
    <div class="head">
      <div class="title">จัดการค่าใช้จ่าย</div>
      <div class="sub">ดูและปิดรายการที่หมดเงื่อนไขแล้ว</div>
    </div>

    <button class="btn-back" onclick="loadUserAndRenderPortal()">กลับ</button>
    <br><br>
  `;

  if (!charges.length) {
    html += `<div class="head">ยังไม่มีรายการค่าใช้จ่าย</div>`;
    document.getElementById('app').innerHTML = html;
    return;
  }

  const grouped = {};

  charges.forEach(function(c) {
    const branchId = String(c.branch_id || c.home_branch_id || 'ไม่ระบุสาขา').trim();

    if (!grouped[branchId]) grouped[branchId] = [];
    grouped[branchId].push(c);
  });

  const branchIds = Object.keys(grouped).sort(function(a, b) {
    return getBranchSortIndex(a) - getBranchSortIndex(b);
  });

  branchIds.forEach(function(branchId) {
    html += `
      <div class="section">
        <div class="title">${getBranchName(branchId)}</div>
        <div class="sub">${branchId}</div>
    `;

    grouped[branchId].forEach(function(c) {
      const active = String(c.active || '').trim() === 'TRUE';
      const deducted = String(c.is_deducted || '').trim() === 'TRUE';

      let statusText = 'ปิดแล้ว';
      if (active && !deducted) statusText = 'ยังมีผล';
      if (deducted) statusText = 'หักแล้ว';

      html += `
        <div class="head">
          <b>${c.charge_name || c.charge_type || '-'}</b><br>
          ${c.employee_code || '-'} ${c.employee_name || ''}<br>
          จำนวนเงิน: ${Number(c.amount || 0).toLocaleString()} บาท<br>
          วันที่รายการ: ${formatDateDdMmYyyy(c.charge_event_date)}<br>
          ครบกำหนด: ${formatDateDdMmYyyy(c.expiry_date)}<br>
          สถานะ: <b>${statusText}</b><br>
          ${c.note ? 'หมายเหตุ: ' + c.note + '<br>' : ''}

          ${
            active && !deducted
              ? `<button class="btn-back" onclick="closeCharge('${c.charge_id}')">ปิดรายการ</button>`
              : ''
          }
        </div>
      `;
    });

    html += `</div>`;
  });

  document.getElementById('app').innerHTML = html;
}

function renderAdvanceEmployeeOptions() {
  const branchId = document.getElementById('advanceBranchId').value;
  const employeeSelect = document.getElementById('advanceEmployeeCode');

  if (!branchId) {
    employeeSelect.innerHTML = '<option value="">เลือกสาขาก่อน</option>';
    return;
  }

  const list = advanceEmployees
    .filter(function(e) {
      const empBranchId = String(e.branch_id || e.home_branch_id || '').trim();
      return empBranchId === branchId;
    })
    .sort(function(a, b) {
      const nameA = String(a.nickname || a.first_name || a.employee_code || '');
      const nameB = String(b.nickname || b.first_name || b.employee_code || '');
      return nameA.localeCompare(nameB, 'th');
    });

  if (!list.length) {
    employeeSelect.innerHTML = '<option value="">ไม่พบพนักงานในสาขานี้</option>';
    return;
  }

  employeeSelect.innerHTML = `
    <option value="">เลือกพนักงาน</option>
    ${list.map(function(e) {
      const name =
        `${e.employee_code} - ` +
        `${e.first_name || ''} ${e.last_name || ''}` +
        `${e.nickname ? ` (${e.nickname})` : ''}`;

      return `<option value="${e.employee_code}">${name}</option>`;
    }).join('')}
  `;
}

function formatDate(value) {
  if (!value) return '-';

  const d = parseDateOnly(value);

  if (!d) {
    return String(value);
  }

  return d.toLocaleDateString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

async function exportPayrollCsv(payrollPeriod) {
  const res = await callApi({
    action: 'getPayrollExportData',
    line_uid: lineUid,
    payroll_period: payrollPeriod
  });

  if (!res.success) {
    alert(res.message || 'Export ไม่สำเร็จ');
    return;
  }

  const rows = res.rows || [];
  if (!rows.length) {
    alert('ไม่มีข้อมูลสำหรับ Export');
    return;
  }

  const headers = [
    'payroll_period',
    'employee_code',
    'full_name',
    'nickname',
    'branch_id',
    'position',
    'bank_name',
    'bank_account_no',
    'bank_account_name',
    'base_salary',
    'ot_amount',
    'gross_amount',
    'charge_deduct_amount',
    'absence_deduct_amount',
    'social_security_amount',
    'deduct_amount',
    'net_amount',
    'status'
  ];

  const csv = [
    headers.join(','),
    ...rows.map(function(row) {
      return headers.map(function(h) {
        const value = row[h] == null ? '' : String(row[h]);
        return '"' + value.replace(/"/g, '""') + '"';
      }).join(',');
    })
  ].join('\n');

  const blob = new Blob(['\uFEFF' + csv], {
    type: 'text/csv;charset=utf-8;'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'payroll_' + payrollPeriod + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}

function formatDateTime(value) {
  if (!value) return '-';

  const d = new Date(value);
  if (isNaN(d.getTime())) return value;

  return d.toLocaleString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function buildChargeBranchOptions(employees) {
  const branchMap = {};

  employees.forEach(function(e) {
    const branchId = String(e.branch_id || e.home_branch_id || '').trim();
    if (!branchId) return;
    branchMap[branchId] = true;
  });

  const ordered = HR_BRANCH_ORDER.filter(function(branchId) {
    return branchMap[branchId];
  });

  Object.keys(branchMap).forEach(function(branchId) {
    if (ordered.indexOf(branchId) === -1) {
      ordered.push(branchId);
    }
  });

  return ordered.map(function(branchId) {
    return `
      <option value="${branchId}">
        ${HR_BRANCH_NAME_MAP[branchId] || branchId}
      </option>
    `;
  }).join('');
}

function getCurrentPayrollPeriodForInput() {
  const now = new Date();

  /*
   * ถ้าวันที่ปัจจุบันเกินวันที่ 20
   * ให้ถือเป็นงวดของเดือนถัดไป
   *
   * เช่น วันที่ 22 กรกฎาคม
   * จะเป็นงวด 2026-08
   * ซึ่งครอบคลุม 21 ก.ค. - 20 ส.ค.
   */

  let year = now.getFullYear();
  let month = now.getMonth() + 1;

  if (now.getDate() > 20) {
    month++;

    if (month > 12) {
      month = 1;
      year++;
    }
  }

  return (
    String(year) +
    '-' +
    String(month).padStart(2, '0')
  );
}


async function submitAttendanceTimesheetExport() {
  const periodInput =
    document.getElementById('attendanceExportPeriod');

  const exportButton =
    document.getElementById('attendanceExportButton');

  const payrollPeriod =

  if (!payrollPeriod) {

  const periodText =

    !confirm(
      'ยืนยันสร้างรายงานเวลาเข้าออก\\n\\n' +
      'งวด: ' + payrollPeriod + '\\n' +
      'ช่วงวันที่: ' + periodText
    )
  ) {
    return;
  }

  exportButton.disabled = true;
  exportButton.textContent = 'กำลังสร้างไฟล์...';

  const res = await callApi({

    return;
  }

  renderAttendanceTimesheetExportResult(res);
}


function getAttendanceExportPeriodText(payrollPeriod) {
  const match =
    String(payrollPeriod || '')
      .match(/^(\d{4})-(\d{2})$/);

  if (!match) return '-';

  const year = Number(match[1]);
  const month = Number(match[2]);

  const startDate =
    new Date(year, month - 2, 21);

  const endDate =
    new Date(year, month - 1, 20);

  return (
    formatDateDdMmYyyy(startDate) +
    ' - ' +
    formatDateDdMmYyyy(endDate)
  );
}

function employeeEscape(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function employeeTodayText() {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

function setApprovalCenterTab(tab) {

function renderPendingEmployeeCards(rows) {
  if (!rows.length) return '<div class="empty">ไม่มีพนักงานใหม่รออนุมัติ</div>';
  return rows.map(function(row) {
    const fullName = [row.first_name, row.last_name].filter(Boolean).join(' ');
    return `
      <div class="approval-card">

function renderPendingLeaveCards(rows) {

  return rows.map(function(row) {
    const leaveNames = {

      ABSENT: 'ขาดงาน', MATERNITY: 'ลาคลอด', MILITARY: 'ลาเกณฑ์ทหาร',

          <button class="btn-save btn-approve" onclick="decideLeaveInAdmin('${employeeEscape(row.leave_id)}','APPROVED')">อนุมัติ</button>
          <button class="btn-back btn-reject" onclick="decideLeaveInAdmin('${employeeEscape(row.leave_id)}','REJECTED')">ปฏิเสธ</button>

async function decideEmployeeRegistration(regId, decision) {
  let note = '';
  if (decision === 'REJECTED') {
    note = prompt('ระบุเหตุผลที่ปฏิเสธ') || '';
    if (!note) return;
  } else if (!confirm('ยืนยันอนุมัติพนักงานคนนี้?')) {
    return;
  }

  try {
    const res = decision === 'APPROVED'
      ? await callApi({ action: 'approveEmployeeRegistrationByLiff', line_uid: lineUid, reg_id: regId })
      : await callApi({ action: 'rejectEmployeeRegistrationByLiff', line_uid: lineUid, reg_id: regId, note: note });
    if (!res.success) return alert(res.message || 'ทำรายการไม่สำเร็จ');
    alert(res.message || 'บันทึกเรียบร้อยแล้ว');
    await renderApprovalCenter('employee');
  } catch (err) {
    alert(err.message || err);
  }
}

async function decideLeaveInAdmin(leaveId, decision) {
  const label = decision === 'APPROVED' ? 'อนุมัติ' : 'ปฏิเสธ';
  let note = label + 'ผ่าน Admin Center';
  if (decision === 'REJECTED') {
    const reason = prompt('ระบุเหตุผลที่ปฏิเสธใบลา');
    if (reason === null || !String(reason).trim()) return;
    note = String(reason).trim();
  } else if (!confirm('ยืนยันอนุมัติใบลานี้?')) {
    return;
  }

  try {
    const res = await callApi({
      action: 'approveLeaveRequest',
      data: { line_uid: lineUid, leave_id: leaveId, decision: decision, note: note }
    });
    if (!res.success) return alert(res.message || 'ทำรายการไม่สำเร็จ');
    alert(res.message || 'บันทึกเรียบร้อยแล้ว');
    await renderApprovalCenter('leave');
  } catch (err) {
    alert(err.message || err);
  }
}

function scheduleWeekdayCheckboxes() {

  if (!shift) return;
  document.getElementById('scMonthlyStart').value = shift.start_time || '';
  document.getElementById('scMonthlyEnd').value = shift.end_time || '';

function syncDailyShiftTimes() {
  const select = document.getElementById('scDailyShift');

function scheduleValidTime(value) {
  return value === '24:00' || /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
}

async function submitMonthlyScheduleInAdmin() {
  const employeeCode = document.getElementById('scMonthlyEmployee').value;
  const period = document.getElementById('scMonthlyPeriod').value.split('|');
  const shiftId = document.getElementById('scMonthlyShift').value;
  const startTime = document.getElementById('scMonthlyStart').value.trim();
  const endTime = document.getElementById('scMonthlyEnd').value.trim();
  const breakMinutes = document.getElementById('scMonthlyBreak').value;
  const offDays = Array.from(document.querySelectorAll('input[name="scOffDay"]:checked')).map(function(el) { return el.value; });

  if (!employeeCode || !period[0] || !period[1] || !shiftId) return alert('กรุณากรอกข้อมูลให้ครบ');
  if (!scheduleValidTime(startTime) || !scheduleValidTime(endTime)) return alert('รูปแบบเวลาต้องเป็น HH:MM เช่น 09:00 หรือ 24:00');
  if (!confirm('ยืนยันสร้างตารางทั้งรอบ? วันที่ที่มีอยู่แล้วจะถูกอัปเดต')) return;

  await submitScheduleCenterAction('generateMonthlySchedule', {
    line_uid: lineUid, employee_code: employeeCode,
    period_start: period[0], period_end: period[1], shift_name: shiftId,
    start_time: startTime, end_time: endTime, break_minutes: breakMinutes, off_days: offDays
  }, 'monthly');
}

async function submitDailyScheduleInAdmin() {
  const employeeCode = document.getElementById('scDailyEmployee').value;
  const date = document.getElementById('scDailyDate').value;
  const shiftId = document.getElementById('scDailyShift').value;
  const noTime = shiftId === 'OFF' || shiftId === 'LEAVE';
  const startTime = noTime ? '' : document.getElementById('scDailyStart').value.trim();
  const endTime = noTime ? '' : document.getElementById('scDailyEnd').value.trim();
  const note = document.getElementById('scDailyNote').value.trim();

  if (!employeeCode || !date || !shiftId) return alert('กรุณากรอกข้อมูลให้ครบ');
  if (!noTime && (!scheduleValidTime(startTime) || !scheduleValidTime(endTime))) return alert('รูปแบบเวลาต้องเป็น HH:MM เช่น 09:00 หรือ 24:00');
  if (!confirm('ยืนยันบันทึกตารางของวันที่ ' + date + '?')) return;

  await submitScheduleCenterAction('saveWorkSchedule', {
    line_uid: lineUid, employee_code: employeeCode, date: date,
    shift_name: shiftId, start_time: startTime, end_time: endTime,
    break_minutes: noTime ? 0 : 60, note: note || 'แก้รายวันผ่าน Admin Center'
  }, 'daily');
}

async function submitScheduleCenterAction(action, data, returnMode) {
  try {
    const res = await callApi({ action: action, data: data });
    if (!res.success) return alert(res.message || 'บันทึกตารางไม่สำเร็จ');
    alert(res.message || 'บันทึกตารางเรียบร้อยแล้ว');
    scheduleCenterState.mode = returnMode;
    drawScheduleCenter();
  } catch (err) {
    alert(err.message || err);
  }
}

function schedulePayrollPeriods() {
  const today = new Date();
  const current = schedulePeriodRange(today);
  const previousBase = new Date(current.startDate); previousBase.setDate(previousBase.getDate() - 1);
  const nextBase = new Date(current.endDate); nextBase.setDate(nextBase.getDate() + 1);
  const periods = [schedulePeriodRange(previousBase), current, schedulePeriodRange(nextBase)];
  const labels = ['รอบก่อนหน้า', 'รอบปัจจุบัน', 'รอบถัดไป'];
  return periods.map(function(period, index) {
    return {
      label: labels[index] + ': ' + formatDate(period.startDate) + ' - ' + formatDate(period.endDate),
      start: employeeDateInput(period.startDate),
      end: employeeDateInput(period.endDate)
    };
  });
}

function schedulePeriodRange(date) {
  const d = new Date(date); const y = d.getFullYear(); const m = d.getMonth(); const day = d.getDate();
  const start = day <= 20 ? new Date(y, m - 1, 21) : new Date(y, m, 21);
  const end = day <= 20 ? new Date(y, m, 20) : new Date(y, m + 1, 20);
  return { startDate: start, endDate: end };
}

function employeeDateInput(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

            ${attendanceStat(row.absent, 'ขาดงาน', 'danger')}
            ${attendanceStat(row.leave, 'ลา', 'info')}
            ${attendanceStat(row.off, 'หยุด', 'info')}
            ${attendanceStat(row.hot, 'ได้ HOT', 'warn')}
          </div>
        </div>`;
    }).join('')}`;
}

function attendanceStat(value, label, className) {
  return `<div class="attendance-stat ${className || ''}"><b>${Number(value || 0)}</b><small>${employeeEscape(label)}</small></div>`;
}

async function loadAttendancePeriodInAdmin() {
  const branchId = document.getElementById('attendancePeriodBranch').value;
  const payrollPeriod = document.getElementById('attendancePeriodValue').value;
  if (!branchId) return alert('กรุณาเลือกสาขา');
  if (!payrollPeriod) return alert('กรุณาเลือกรอบวันที่');

  document.getElementById('attendanceCenterResult').innerHTML = '<div class="loading">กำลังโหลดข้อมูลรายงวด...</div>';
  try {
    const res = await callApi({
      action: 'getHrAttendancePeriodCalendars',
      line_uid: lineUid,
      branch_id: branchId,
      payroll_period: payrollPeriod
    });
    if (!res.success) return alert(res.message || 'โหลดข้อมูลไม่สำเร็จ');
    attendanceCenterState.periodResult = res;
    document.getElementById('attendanceCenterResult').innerHTML = renderAttendancePeriodResult(res);
  } catch (err) {
    alert(err.message || err);
  }
}

function renderAttendancePeriodResult(res) {
  if (!res) return '<div class="empty">เลือกสาขาและรอบวันที่แล้วกดแสดงข้อมูล</div>';
  const employees = res.employees || [];
  if (!employees.length) return '<div class="empty">ไม่พบพนักงานในสาขาและรอบที่เลือก</div>';

  return `
    <div class="sub" style="margin:14px 0">
      <b>${employeeEscape(res.branch_name || res.branch_id || '')}</b><br>
      รอบ ${employeeEscape(res.period_display || '')} · ${employees.length} คน
    </div>
    ${employees.map(function(employee) {
      return renderAttendanceEmployeeCalendar(employee, res.range_start, res.range_end);
    }).join('')}`;
}

function renderAttendanceEmployeeCalendar(employee, rangeStart, rangeEnd) {
  const summary = employee.summary || {};
  const dailyMap = buildAttendanceDailyMap(employee.rows || []);
  return `
    <details class="attendance-employee" open>
      <summary>
        <div class="approval-name">${employeeEscape(employee.nickname || employee.employee_name || '-')}</div>
        <div class="approval-meta">${employeeEscape(employee.employee_code || '')} · ${employeeEscape(employee.position || '')}</div>
        <div class="attendance-stat-grid">
          ${attendanceStat(summary.late_count, 'มาสาย ' + Number(summary.late_minutes || 0) + ' นาที', 'warn')}
          ${attendanceStat(summary.ot_hours || '0.00', 'OT ชั่วโมง', '')}
          ${attendanceStat(summary.absent_count, 'ขาดงาน', 'danger')}
          ${attendanceStat(summary.leave_count, 'ลา', 'info')}
        </div>
      </summary>
      <div class="attendance-calendar-wrap">
        ${buildAttendanceCalendar(rangeStart, rangeEnd, dailyMap, summary.by_date || {})}
      </div>
    </details>`;
}

function buildAttendanceDailyMap(rows) {
  const map = {};
  rows.forEach(function(row) {
    const dateText = String(row.date || '').trim();
    if (!dateText) return;
    if (!map[dateText]) map[dateText] = { check_in: '', check_out: '' };
    if (row.check_type === 'CHECK_IN' && (!map[dateText].check_in || new Date(row.datetime) < new Date(map[dateText].check_in))) {
      map[dateText].check_in = row.datetime;
    }
    if (row.check_type === 'CHECK_OUT' && (!map[dateText].check_out || new Date(row.datetime) > new Date(map[dateText].check_out))) {
      map[dateText].check_out = row.datetime;
    }
  });
  return map;
}

function buildAttendanceCalendar(startText, endText, dailyMap, summaryMap) {
  const start = attendanceParseDate(startText);
  const end = attendanceParseDate(endText);
  if (!start || !end) return '<div class="error">รูปแบบวันที่ไม่ถูกต้อง</div>';

  const heads = ['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
  let html = '<div class="attendance-calendar">' + heads.map(function(head) {
    return `<div class="attendance-day-head">${head}</div>`;
  }).join('');

  const current = new Date(start);
  const offset = current.getDay() === 0 ? 6 : current.getDay() - 1;
  for (let i = 0; i < offset; i++) html += '<div class="attendance-day empty"></div>';

  const today = employeeTodayText();
  while (current <= end) {
    const dateText = employeeDateInput(current);
    const dayData = dailyMap[dateText] || {};
    const daySummary = summaryMap[dateText] || {};
    const status = String(daySummary.attendance_status || '').trim().toUpperCase();
    const lateMinutes = Number(daySummary.late_minutes || 0);
    let className = '';
    let content = '';

    if (status === 'OFF') { className = 'off'; content = '<b>หยุด</b>'; }
    else if (status === 'HOT') { className = 'hot'; content = '<b>HOT</b>'; }
    else if (['LEAVE','SICK','VACATION'].indexOf(status) !== -1) { className = 'leave'; content = '<b>ลา</b>'; }
    else if (status === 'ABSENT') { className = 'absent'; content = '<b>ขาด</b>'; }
    else if (dayData.check_in) {
      className = !dayData.check_out ? 'missing' : (lateMinutes > 0 ? 'late' : 'present');
      content = 'เข้า ' + employeeEscape(attendanceFormatTime(dayData.check_in));
      if (dayData.check_out) content += '<br>ออก ' + employeeEscape(attendanceFormatTime(dayData.check_out));
      if (lateMinutes > 0) content += '<br>สาย ' + lateMinutes + ' นาที';
      if (!dayData.check_out) content += '<br>ไม่มีเวลาออก';
    }
    if (dateText === today) className += ' today';
    html += `<div class="attendance-day ${className}"><div class="attendance-day-num">${current.getDate()}</div>${content}</div>`;
    current.setDate(current.getDate() + 1);
  }

  const trailing = current.getDay() === 1 ? 0 : (current.getDay() === 0 ? 1 : 8 - current.getDay());
  for (let i = 0; i < trailing; i++) html += '<div class="attendance-day empty"></div>';
  return html + '</div>';
}

function attendanceParseDate(value) {
  if (!value) return null;
  const match = String(value).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const date = match
    ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12, 0, 0)
    : new Date(value);
  return isNaN(date.getTime()) ? null : date;
}

function attendanceFormatTime(value) {
  if (!value) return '-';
  const date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
}
