<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HR Staff Center</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #2f2f2f;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
    }

    .hello {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
    }

    .sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .pill,
    .info,
    .ot-box {
      background: #eef6e8;
      border-radius: 18px;
      padding: 14px;
      line-height: 1.8;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .box {
      background: #fff7e8;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .box.danger,
    .late-box,
    .absent-box {
      background: #ffe2e2;
    }

    .num {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .label {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 14px 0 6px;
      color: #555;
    }

    .input,
    textarea.input,
    select.input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    textarea.input {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      margin-top: 12px;
      cursor: pointer;
      background: #7fb069;
      color: white;
    }

    .btn.orange { background: #f4a259; }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-sub {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      opacity: 0.9;
    }

    .note {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
      margin-top: 12px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .error {
      background: #fff0f0;
      color: #a33;
      border-radius: 16px;
      line-height: 1.6;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid #ddd;
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
    }

    .day-head {
      background: #eef6e8;
      padding: 8px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      border-right: 1px solid #ddd;
    }

    .day-cell {
      height: 82px;
      min-width: 0;
      padding: 6px 3px;
      border-top: 1px solid #ddd;
      border-right: 1px solid #ddd;
      font-size: 10px;
      background: #fff;
      overflow: hidden;
      position: relative;
    }

    .day-cell.off {
      background: #ffe2e2;
      color: #b22222;
    }

    .day-cell.holiday {
      background: #e4f6df;
      color: #2f6b2f;
    }

    .empty-cell {
      background: #fafafa;
    }

    .day-num {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .shift-time {
      font-size: 10px;
      line-height: 1.3;
    }

    .today {
      border: 2px solid #2f6b2f;
      box-shadow: inset 0 0 0 1px #2f6b2f;
    }

    .today-tag {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: #2f6b2f;
      border-radius: 50%;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .dot.work { background: #ddd; }
    .dot.off { background: #f4b6b6; }
    .dot.holiday { background: #b8e8b8; }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .summary-box {
      background: #eef6e8;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .summary-box.orange { background: #fff0d6; }
    .summary-box.red { background: #ffe2e2; }

    .day-cell.present { background: #f4fbf0; }
    .day-cell.late {
      background: #fff0d6;
      color: #9a5a00;
    }
    .day-cell.missing { background: #fff7cc; }
    .day-cell.hot { background: #e4f6df; }
    .day-cell.off { background: #ffe2e2; }

    .late-text {
      color: #b05a00;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="pageAttendance" class="page active">
      <div class="card" id="attendanceApp">
        <div class="loading">กำลังโหลดข้อมูล...</div>
      </div>
    </section>

    <section id="pageProfile" class="page">
      <div class="card" id="profileApp">
        <div class="loading">กำลังโหลดข้อมูล...</div>
      </div>
    </section>

    <section id="pageSchedule" class="page">
      <div class="card">
        <div class="title">ตารางงานของฉัน</div>
        <div class="sub" id="scheduleRangeText">รอบการทำงาน</div>
      </div>

      <div id="scheduleApp">
        <div class="card loading">กำลังโหลด...</div>
      </div>
    </section>

    <section id="pageLeave" class="page">
      <div class="card" id="leaveApp">
        <div class="loading">กำลังโหลด...</div>
      </div>
    </section>

    <section id="pageAttendanceHistory" class="page">
      <div class="card">
        <div class="title">ประวัติการเข้างาน</div>
        <div class="sub" id="attendanceHistoryInfo">กำลังโหลดข้อมูล...</div>
      </div>

      <div id="attendanceHistoryApp">
        <div class="card loading">กำลังโหลด...</div>
      </div>
    </section>

  </div>

  <script>
    const LIFF_ID = '2010317944-48vTQqDt';

    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

    let lineUid = '';
    let lineProfile = null;
    let attendanceData = null;

    let loadedProfile = false;
    let loadedSchedule = false;
    let loadedLeave = false;
    let loadedAttendanceHistory = false;

    async function main() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        lineProfile = await liff.getProfile();
        lineUid = lineProfile.userId;

        await loadAttendanceData();

        openStartPage();   // << เพิ่มบรรทัดนี้

      } catch (err) {
        showError('attendanceApp', err.message || err);
      }
    }

    async function callApi(payload) {
  const action = String(payload && payload.action || '');

  // เฉพาะคำสั่งอ่านข้อมูลเท่านั้นที่ลองใหม่อัตโนมัติ
  // ป้องกันคำสั่งบันทึก เช่น เช็คอิน/ลา ถูกส่งซ้ำ
  const canRetry =
    action.indexOf('get') === 0;

  const maxAttempts = canRetry ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        redirect: 'follow'
      });

      const text = await res.text();
      const trimmed = String(text || '').trim();

      // HTTP ผิดปกติ
      if (!res.ok) {
        throw new Error(
          'SERVER_HTTP_' + res.status
        );
      }

      // Google / Apps Script ส่ง HTML กลับมาแทน JSON
      if (
        trimmed.charAt(0) === '<' ||
        /^<!doctype html/i.test(trimmed) ||
        /^<html/i.test(trimmed)
      ) {
        console.error(
          'API returned HTML instead of JSON',
          {
            action: action,
            status: res.status,
            response: trimmed.slice(0, 500)
          }
        );

        throw new Error('SERVER_RETURNED_HTML');
      }

      let result;

      try {
        result = JSON.parse(trimmed);
      } catch (parseError) {
        console.error(
          'Invalid API response',
          {
            action: action,
            status: res.status,
            response: trimmed.slice(0, 500)
          }
        );

        throw new Error('INVALID_SERVER_RESPONSE');
      }

      return result;

    } catch (err) {
      lastError = err;

      console.error(
        'API request failed',
        {
          action: action,
          attempt: attempt,
          maxAttempts: maxAttempts,
          error: err
        }
      );

      if (attempt < maxAttempts) {
        await waitBeforeRetry(attempt);
      }
    }
  }

  const errorText =
    String(
      lastError && lastError.message
        ? lastError.message
        : lastError || ''
    );

  if (
    errorText === 'SERVER_RETURNED_HTML' ||
    errorText.indexOf('SERVER_HTTP_') === 0 ||
    errorText === 'INVALID_SERVER_RESPONSE' ||
    errorText.indexOf('Failed to fetch') !== -1 ||
    errorText.indexOf('NetworkError') !== -1
  ) {
    throw new Error(
      'ระบบเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณารอสักครู่แล้วกดลองใหม่'
    );
  }

  throw lastError || new Error(
    'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'
  );
}

function waitBeforeRetry(attempt) {
  const delay =
    attempt === 1
      ? 800
      : 1600;

  return new Promise(function(resolve) {
    setTimeout(resolve, delay);
  });
}

    function getStartPage() {
      const params = new URLSearchParams(window.location.search);
      return String(params.get('page') || 'attendance').toLowerCase();
    }

    function openStartPage() {
      const startPage = getStartPage();

      if (startPage === 'profile') {
        showPage('Profile');
        return;
      }

      if (startPage === 'schedule') {
        showPage('Schedule');
        return;
      }

      if (startPage === 'leave') {
        showPage('Leave');
      return;
      }

      showPage('Attendance');
    }

    function showPage(name) {
      document.querySelectorAll('.page').forEach(function(page) {
        page.classList.remove('active');
      });

      const target = document.getElementById('page' + name);
      if (target) target.classList.add('active');

      window.scrollTo(0, 0);

      if (name === 'Profile' && !loadedProfile) loadProfile();
      if (name === 'Schedule' && !loadedSchedule) loadSchedule();
      if (name === 'Leave' && !loadedLeave) loadLeaveForm();
      if (name === 'AttendanceHistory' && !loadedAttendanceHistory) { loadAttendanceHistory();}
    }

    async function loadAttendanceData() {
      showLoading('attendanceApp', 'กำลังโหลดข้อมูลพนักงาน...');

      const res = await callApi({
        action: 'getAttendancePageData',
        line_uid: lineUid
      });

      attendanceData = res;
      renderAttendance(res);
    }

    function renderAttendance(res) {
      const app = document.getElementById('attendanceApp');

      if (!res.success) {
        if (res.message && res.message.indexOf('ไม่พบข้อมูลพนักงาน') !== -1) {
          renderRegistrationForm();
        } else {
          showError('attendanceApp', res.message || 'โหลดข้อมูลไม่สำเร็จ');
        }
        return;
      }

      const buttons = (res.buttons || []).map(function(btn, index) {
        const color = index === 0 ? '' : 'orange';
        return `
          <button class="btn ${color}" onclick="submitAttendanceAction('${btn.action}')">
            ${btn.label}
          </button>
        `;
      }).join('');

      app.innerHTML = `
        <div class="hello">สวัสดี ${res.nickname || ''}</div>
        <div class="sub">สาขา ${res.branch_name || res.branch_id || '-'}</div>

        <div class="pill">
          สถานะตอนนี้: <b>${translateStatus(res.current_status)}</b><br>
          รายการล่าสุด: ${translateAction(res.last_action) || '-'}<br>
          เวลา: ${formatTime(res.last_action_time)}
        </div>

        ${buttons || '<div class="note">วันนี้บันทึกครบแล้ว</div>'}

        <div class="note">
          ระบบจะบันทึกเวลา ตำแหน่ง และรูปถ่ายเพื่อยืนยันการเข้างาน
        </div>
      `;
    }

    async function submitAttendanceAction(action) {
      if (window.isSubmitting) {
        return;
      }

      window.isSubmitting = true;

      const firstConfirm =
        confirm('ยืนยันทำรายการนี้?');

      if (!firstConfirm) {
        window.isSubmitting = false;
        return;
      }

      let photoBase64 = '';

      try {
        if (
          action === 'CHECK_IN' ||
          action === 'CHECK_OUT'
        ) {
          photoBase64 =
            await captureFreshPhoto();

          if (!photoBase64) {
            return;
          }
        }

        showLoading(
          'attendanceApp',
          'กำลังตรวจตำแหน่ง...'
        );

        const gps =
          await getCurrentLocation();

        showLoading(
          'attendanceApp',
          'กำลังตรวจสอบเวลาทำงาน...'
        );

        const requestData = {
          employee_code:
            attendanceData.employee_code,

          check_type: action,

          gps_lat: gps.lat,
          gps_lng: gps.lng,

          photo_base64: photoBase64,

          device_info:
            navigator.userAgent,

          os: getOS(),

          app_version:
            'LIFF_STAFF_CENTER_V1',

          note:
            'บันทึกจาก LIFF',

          early_checkout_confirmed:
            false,

          early_checkout_reason:
            ''
        };

        let res = await callApi({
          action:
            'recordAttendanceAction',

          data: requestData
        });

        /*
         * เซิร์ฟเวอร์พบว่าเวลาไม่ครบ
         * ให้พนักงานอ่านรายละเอียดและยืนยันอีกครั้ง
         */
        if (
          res.requires_early_checkout_confirmation
        ) {
          const checkoutMessage =
            buildEarlyCheckoutMessage_(res);

          const confirmEarlyCheckout =
            confirm(checkoutMessage);

          if (!confirmEarlyCheckout) {
            await loadAttendanceData();
            return;
          }

          const reason =
            requestEarlyCheckoutReason_();

          if (!reason) {
            alert(
              'ยกเลิกการเช็กเอาต์ เนื่องจากไม่ได้ระบุเหตุผล'
            );

            await loadAttendanceData();
            return;
          }

                    requestData.early_checkout_confirmed =
            true;

          requestData.early_checkout_reason =
            reason;

          /*
           * ส่งผลที่เซิร์ฟเวอร์คำนวณในรอบแรกกลับไปด้วย
           * เพื่อไม่ต้องอ่าน Attendance_Log ซ้ำ
           */
          requestData.early_checkout_work_time = {
            gross_minutes:
              res.gross_minutes,

            break_minutes:
              res.break_minutes,

            net_minutes:
              res.net_minutes,

            required_minutes:
              res.required_minutes,

            missing_minutes:
              res.missing_minutes
          };

          showLoading(
            'attendanceApp',
            'กำลังบันทึกการออกก่อนครบเวลา...'
          );

          /*
           * ส่งข้อมูลเดิมซ้ำพร้อมคำยืนยัน
           * ไม่ต้องถ่ายรูปและขอ GPS ใหม่
           */
          res = await callApi({
            action:
              'recordAttendanceAction',

            data: requestData
          });
        }

        if (!res.success) {
          showError(
            'attendanceApp',
            res.message ||
            'บันทึกไม่สำเร็จ'
          );

          return;
        }

        alert(
          res.message ||
          'บันทึกสำเร็จ'
        );

        await loadAttendanceData();

      } catch (err) {
        showError(
          'attendanceApp',
          err.message || err
        );

      } finally {
        window.isSubmitting = false;
      }
    }

        function buildEarlyCheckoutMessage_(data) {
      const grossTime =
        formatWorkMinutes_(
          data.gross_minutes
        );

      const breakTime =
        formatWorkMinutes_(
          data.break_minutes
        );

      const netTime =
        formatWorkMinutes_(
          data.net_minutes
        );

      const missingTime =
        formatWorkMinutes_(
          data.missing_minutes
        );

      return (
        '⚠️ เวลาทำงานยังไม่ครบ\n\n' +

        'เวลาตั้งแต่เข้างานรวม: ' +
        grossTime + '\n' +

        'หักเวลาพักอัตโนมัติ: ' +
        breakTime + '\n' +

        'เวลาทำงานสุทธิ: ' +
        netTime + '\n' +

        'ยังขาดอีก: ' +
        missingTime + '\n\n' +

        'ต้องการยืนยันเช็กเอาต์ตอนนี้หรือไม่?'
      );
    }


    function formatWorkMinutes_(minutes) {
      const totalMinutes = Math.max(
        0,
        Number(minutes || 0)
      );

      const hours = Math.floor(
        totalMinutes / 60
      );

      const remainingMinutes =
        totalMinutes % 60;

      if (
        hours > 0 &&
        remainingMinutes > 0
      ) {
        return (
          hours +
          ' ชั่วโมง ' +
          remainingMinutes +
          ' นาที'
        );
      }

      if (hours > 0) {
        return hours + ' ชั่วโมง';
      }

      return remainingMinutes + ' นาที';
    }

        function requestEarlyCheckoutReason_() {
      const choice = prompt(
        'กรุณาระบุเหตุผลที่เช็กเอาต์ก่อนครบเวลา\n\n' +
        '1 = หัวหน้าอนุญาตให้กลับก่อน\n' +
        '2 = ลาป่วย / มีเหตุฉุกเฉิน\n' +
        '3 = ทำงานตามตารางกะสั้น\n' +
        '4 = ลืมเช็กอินหรือเวลาเข้างานไม่ถูกต้อง\n' +
        '5 = อื่น ๆ\n\n' +
        'กรุณาพิมพ์หมายเลข 1–5'
      );

      if (choice === null) {
        return '';
      }

      const cleanChoice =
        String(choice).trim();

      const reasonMap = {
        '1':
          'หัวหน้าอนุญาตให้กลับก่อน',

        '2':
          'ลาป่วย / มีเหตุฉุกเฉิน',

        '3':
          'ทำงานตามตารางกะสั้น',

        '4':
          'ลืมเช็กอินหรือเวลาเข้างานไม่ถูกต้อง'
      };

      if (reasonMap[cleanChoice]) {
        return reasonMap[cleanChoice];
      }

      if (cleanChoice === '5') {
        const otherReason = prompt(
          'กรุณาระบุเหตุผลเพิ่มเติม'
        );

        if (otherReason === null) {
          return '';
        }

        const cleanOtherReason =
          String(otherReason).trim();

        if (!cleanOtherReason) {
          alert(
            'กรุณาระบุเหตุผลเพิ่มเติม'
          );

          return '';
        }

        return (
          'อื่น ๆ: ' +
          cleanOtherReason
        );
      }

      alert(
        'กรุณาเลือกหมายเลข 1–5'
      );

      return '';
    }

    function renderRegistrationForm() {
      const app = document.getElementById('attendanceApp');

      app.innerHTML = `
        <div class="hello">สมัครเข้าระบบพนักงาน</div>
        <div class="sub">กรอกข้อมูลเบื้องต้นเพื่อให้ HR อนุมัติ</div>

        <label>สาขา</label>
        <select id="regBranch" class="input">
          <option value="">เลือกสาขา</option>
          <option value="P CL">P CL - PikMee ชิดลม</option>

    function captureFreshPhoto() {
      return new Promise(function(resolve) {
        const app = document.getElementById('attendanceApp');

        app.innerHTML = `
          <div class="hello">ถ่ายรูปยืนยัน</div>
          <div class="sub">กรุณาถ่ายรูปสดก่อนบันทึกเวลา</div>

          <video id="cameraPreview" autoplay playsinline style="
            width:100%;
            border-radius:20px;
            background:#000;
            margin-bottom:14px;
          "></video>

          <canvas id="photoCanvas" style="display:none;"></canvas>

          <button class="btn" id="takePhotoBtn">📸 ถ่ายรูป</button>
          <button class="btn orange" id="cancelPhotoBtn">ยกเลิก</button>

          <div class="note">
            ต้องถ่ายรูปจากกล้องเท่านั้น ไม่สามารถเลือกรูปจากอัลบั้มได้
          </div>
        `;

        const video = document.getElementById('cameraPreview');
        const canvas = document.getElementById('photoCanvas');
        const takeBtn = document.getElementById('takePhotoBtn');
        const cancelBtn = document.getElementById('cancelPhotoBtn');

        let stream = null;

        navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        })
        .then(function(s) {
          stream = s;
          video.srcObject = stream;
        })
        .catch(function(err) {
          showError('attendanceApp', 'ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้งานกล้อง');
          resolve(null);
        });

        takeBtn.onclick = function() {
          if (!stream) {
            alert('กล้องยังไม่พร้อม');
            return;
          }

          const width = video.videoWidth || 720;
          const height = video.videoHeight || 960;

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, width, height);

          const photoBase64 = canvas.toDataURL('image/jpeg', 0.82);

          stopCameraStream(stream);
          resolve(photoBase64);
        };

        cancelBtn.onclick = function() {
          if (stream) stopCameraStream(stream);
          loadAttendanceData();
          resolve(null);
        };
      });
    }

    function getCurrentLocation() {
      return new Promise(function(resolve, reject) {
        if (!navigator.geolocation) {
          reject(new Error('เครื่องนี้ไม่รองรับ GPS'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function(pos) {
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            });
          },
          function(err) {
            reject(new Error('ไม่สามารถอ่านตำแหน่งได้ กรุณาอนุญาต GPS'));
          },
          {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
          }
        );
      });
    }

    function formatDate(value) {
      if (!value) return '-';

      const d = new Date(value);
      if (isNaN(d.getTime())) return value;

      return d.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function formatTime(value) {
      if (!value) return '-';

      const d = new Date(value);
      if (isNaN(d.getTime())) return value;

      return d.toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatFullThaiDate(value) {
      if (!value) return '-';

      const d = new Date(value);
      if (isNaN(d.getTime())) return value;

      const weekdays = [
        'วันอาทิตย์',
        'วันจันทร์',
        'วันอังคาร',
        'วันพุธ',
        'วันพฤหัสบดี',
        'วันศุกร์',
        'วันเสาร์'
      ];

      const months = [
        'ม.ค.',
        'ก.พ.',
        'มี.ค.',
        'เม.ย.',
        'พ.ค.',
        'มิ.ย.',
        'ก.ค.',
        'ส.ค.',
        'ก.ย.',
        'ต.ค.',
        'พ.ย.',
        'ธ.ค.'
      ];

      const dayName = weekdays[d.getDay()];
      const day = d.getDate();
      const month = months[d.getMonth()];
      const year = String(d.getFullYear() + 543).slice(-2);

      return dayName + 'ที่ ' + day + ' ' + month + ' ' + year;
    }

    function buildCalendarHtml(startText, endText, scheduleMap, holidayMap) {
      const weekHeads = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];

      const start = new Date(startText);
      const end = new Date(endText);

      const first = new Date(start);
      const day = first.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      first.setDate(first.getDate() + mondayOffset);

      let html = '<div class="calendar">';

      weekHeads.forEach(function(w) {
        html += '<div class="day-head">' + w + '</div>';
      });

      const current = new Date(first);

      while (current <= end || current.getDay() !== 1) {
        const dateText = toDateText(current);
        const inRange = current >= start && current <= end;
        const sch = scheduleMap[dateText];
        const holiday = holidayMap[dateText];
        const todayText = toDateText(new Date());
        const isToday = dateText === todayText;

        const isOffDay =
          sch &&
          (
            sch.is_off_day === true ||
            String(sch.is_off_day).toUpperCase() === 'TRUE'
          );

        let cls = 'day-cell';
        let content = '';

        if (!inRange) {
          cls += ' empty-cell';
        } else if (isOffDay) {
          cls += ' off';
          content = '<div class="day-num">' + current.getDate() + '</div>';
        } else if (holiday) {
          cls += ' holiday';
          content =
            '<div class="day-num">' + current.getDate() + '</div>' +
            '<b>HOT</b><br>' +
            '<span class="shift-time">' + getShiftText(sch) + '</span>';
        } else {
          content =
            '<div class="day-num">' + current.getDate() + '</div>' +
            '<span class="shift-time">' + getShiftText(sch) + '</span>';
        }

        if (isToday && inRange) {
          cls += ' today';
          content += '<div class="today-tag"></div>';
        }

        html += '<div class="' + cls + '">' + content + '</div>';

        current.setDate(current.getDate() + 1);

        if (current > end && current.getDay() === 1) break;
      }

      html += '</div>';
      return html;
    }

    function getShiftText(sch) {
      if (!sch) return '';

      if (String(sch.shift_name).toUpperCase() === 'LEAVE') {
        return 'ลา';
      }

      const start = sch.start_time || '-';
      const end = sch.end_time || '-';

      return start + ' - ' + end;
    }

    function calculateEstimatedOt(days) {
      let total = 0;

      days.forEach(function(d) {
        if (!d.start_time || !d.end_time) return;
        if (String(d.shift_name).toUpperCase() === 'OFF') return;
        if (String(d.shift_name).toUpperCase() === 'LEAVE') return;

        const minutes = diffMinutes(d.start_time, d.end_time);
        const breakMinutes = Number(d.break_minutes || 0);
        const workHours = (minutes - breakMinutes) / 60;

        if (workHours > 8) {
          total += workHours - 8;
        }
      });

      return Math.max(0, total).toFixed(2);
    }

    function diffMinutes(start, end) {
      const s = String(start).split(':');
      const e = String(end).split(':');

      const sm = Number(s[0]) * 60 + Number(s[1] || 0);
      const em = Number(e[0]) * 60 + Number(e[1] || 0);

      return em >= sm ? em - sm : em + 1440 - sm;
    }

    function toDateText(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');

      return y + '-' + m + '-' + day;
    }

    //==================================================
    // ATTENDANCE HISTORY
    //==================================================

    async function loadAttendanceHistory() {
      loadedAttendanceHistory = true;

      document.getElementById('attendanceHistoryApp').innerHTML =
        '<div class="card loading">กำลังโหลด...</div>';

      try {
        const res = await callApi({
          action: 'getMyAttendanceHistory',
          line_uid: lineUid
        });

        if (!res.success) {
          showError('attendanceHistoryApp', res.message || 'โหลดข้อมูลไม่สำเร็จ');
          return;
        }

        renderAttendanceHistory(res);

      } catch (err) {
        showError('attendanceHistoryApp', err.message || err);
      }
    }

    function renderAttendanceHistory(res) {
      const emp = res.employee || {};
      const rows = res.rows || [];
      const summary = res.summary || {};

      document.getElementById('attendanceHistoryInfo').innerHTML =
        `${emp.nickname || ''} · ${emp.employee_code || ''}<br>` +
        `รอบ ${formatFullThaiDate(res.range_start)} - ${formatFullThaiDate(res.range_end)}`;

      const dailyMap = buildAttendanceDailyMap(rows);

      document.getElementById('attendanceHistoryApp').innerHTML = `
        <div class="card">
          <div class="summary-grid">
            <div class="summary-box orange">
              <div class="num">${summary.late_count || 0}</div>
              <div class="label">มาสาย<br>${summary.late_minutes || 0} นาที</div>
            </div>

            <div class="summary-box">
              <div class="num">${summary.ot_hours || '0.00'}</div>
              <div class="label">OT สะสม<br>ชั่วโมง</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="legend">
            <span><i class="dot present"></i> มีบันทึกเวลา</span>
            <span><i class="dot late"></i> มาสาย</span>
            <span><i class="dot none"></i> ไม่มีบันทึก</span>
          </div>

          ${buildAttendanceHistoryCalendar(
            res.range_start,
            res.range_end,
            dailyMap,
            summary.by_date || {}
          )}
        </div>
      `;
    }
  
    function buildAttendanceDailyMap(rows) {
      const map = {};

      rows.forEach(function(r) {
        const dateText = r.date;

        if (!map[dateText]) {
          map[dateText] = {
            date: dateText,
            check_in: '',
            check_out: ''
          };
        }

        if (r.check_type === 'CHECK_IN') {
          if (
            !map[dateText].check_in ||
            new Date(r.datetime) < new Date(map[dateText].check_in)
          ) {
            map[dateText].check_in = r.datetime;
          }
        }

        if (r.check_type === 'CHECK_OUT') {
          if (
            !map[dateText].check_out ||
            new Date(r.datetime) > new Date(map[dateText].check_out)
            ) {
            map[dateText].check_out = r.datetime;
          }
        }
      });

      return map;
    }

    function buildAttendanceHistoryCalendar(startText, endText, dailyMap, summaryMap) {
      const weekHeads = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];

      const start = new Date(startText);
      const end = new Date(endText);

      const first = new Date(start);
      const day = first.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;
      first.setDate(first.getDate() + mondayOffset);

      let html = '<div class="calendar">';

      weekHeads.forEach(function(w) {
        html += '<div class="day-head">' + w + '</div>';
      });

      const current = new Date(first);
      const todayText = toDateText(new Date());

      while (current <= end || current.getDay() !== 1) {
        const dateText = toDateText(current);
        const inRange = current >= start && current <= end;

        const dayData = dailyMap[dateText] || null;
        const daySummary = summaryMap[dateText] || {};

        const attendanceStatus = daySummary.attendance_status || '';
        const lateMinutes = Number(daySummary.late_minutes || 0);

        let cls = 'day-cell';
        let content = '';

        if (!inRange) {
          cls += ' empty-cell';
        } else {
          const isToday = dateText === todayText;

          content = '<div class="day-num">' + current.getDate() + '</div>';

       if (attendanceStatus === 'OFF') {
         cls += ' off';
         content += '<div class="time-line"><b>หยุด</b></div>';
        } else if (attendanceStatus === 'HOT') {
          cls += ' hot';
          content += '<div class="time-line"><b>HOT</b></div>';
        } else if (dayData && dayData.check_in) {
          const missingCheckout = !dayData.check_out;

        if (missingCheckout) {
          cls += ' missing';
        } else if (lateMinutes > 0) {
          cls += ' late';
        } else {
          cls += ' present';
        }

        content +=
          '<div class="time-line">เข้า ' + formatTime(dayData.check_in) + '</div>' +
          '<div class="time-line">ออก ' + formatTime(dayData.check_out) + '</div>' +
          (
            lateMinutes > 0
              ? '<div class="time-line late-text">สาย ' + lateMinutes + ' นาที</div>'
              : ''
          );
      }

      if (isToday) {
        cls += ' today';
        content += '<div class="today-tag"></div>';
      }
    }

    html += '<div class="' + cls + '">' + content + '</div>';

    current.setDate(current.getDate() + 1);
    if (current > end && current.getDay() === 1) break;
    }

    html += '</div>';
    return html;
  }

    function getOS() {
      const ua = navigator.userAgent || '';

      if (/android/i.test(ua)) return 'Android';
      if (/iPad|iPhone|iPod/.test(ua)) return 'iOS';
      if (/Windows/.test(ua)) return 'Windows';
      if (/Mac/.test(ua)) return 'Mac';

      return 'Unknown';
    }

    function showLoading(targetId, text) {
      document.getElementById(targetId).innerHTML = `
        <div class="loading">${text || 'กำลังโหลด...'}</div>
      `;
    }

    function showError(targetId, message) {
      document.getElementById(targetId).innerHTML = `
        <div class="error">
          ${message}
          <br><br>
          <button class="btn" onclick="location.reload()">ลองใหม่</button>
        </div>
      `;
    }

    main();
  </script>
