<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Attendance Dashboard</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #2f2f2f;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      margin-bottom: 14px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .box {
      background: #eef6e8;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .box .num {
      font-size: 26px;
      font-weight: 800;
    }

    .box .label {
      font-size: 13px;
      color: #666;
    }

    .row {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .meta {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
      background: #eee;
    }

    .WORKING {
      background: #e4f4df;
      color: #477a37;
    }

    .ON_BREAK {
      background: #fff0d6;
      color: #9a6400;
    }

    .CHECKED_OUT {
      background: #eee;
      color: #555;
    }

    .NOT_CHECKED_IN {
      background: #ffe2e2;
      color: #a33;
    }

    .MISSING_CHECKOUT {
      background: #fff0d6;
      color: #9a6400;
    }

    .LEAVE {
      background: #e8e0ff;
      color: #6042a6;
    }

    .OFF {
      background: #e6f1ff;
      color: #2f6597;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      background: #7fb069;
      color: white;
      margin-top: 10px;
    }

    .input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      background: #fff;
      margin-top: 10px;
    }

    .loading,
    .error,
    .empty {
      padding: 28px 10px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #a33;
      background: #fff0f0;
      border-radius: 16px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Dashboard พนักงาน</div>
      <div class="sub" id="accessInfo">กำลังตรวจสอบสิทธิ์...</div>

      <select id="branchSelect" class="input">
        <option value="">เลือกสาขา</option>
        <option value="P EV">P EV - PikMee อีสท์วิลล์</option>
        <option value="P LP">P LP - PikMee ลาดพร้าว</option>
        <option value="P PK">P PK - PikMee ปิ่นเกล้า</option>
        <option value="P BN">P BN - PikMee บางนา</option>
        <option value="P R9">P R9 - PikMee พระราม9</option>
        <option value="P R3">P R3 - PikMee พระราม3</option>
        <option value="P FI">P FI - PikMee แฟชั่น</option>
        <option value="P SC">P SC - PikMee สีลม</option>
        <option value="P R2">P R2 - PikMee พระราม2</option>

        <option value="C EV">C EV - CadoCado อีสท์วิลล์</option>
        <option value="C LP">C LP - CadoCado ลาดพร้าว</option>
        <option value="C PK">C PK - CadoCado ปิ่นเกล้า</option>
        <option value="C BN">C BN - CadoCado บางนา</option>
        <option value="C R9">C R9 - CadoCado พระราม9</option>
        <option value="C R3">C R3 - CadoCado พระราม3</option>
        <option value="C CL">C CL - CadoCado ชิดลม</option>
        <option value="C R2">C R2 - CadoCado พระราม2</option>
      </select>
      
      <input id="dateInput" class="input" type="date">
      <button class="btn" onclick="loadDashboard()">ดูสถานะ</button>
    </div>

    <div id="app">
      <div class="card loading">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010317944-qrJlENj0';

    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

    let lineUid = '';
    let dashboardAccess = null;

  async function callApi(payload) {
  const action = String(payload && payload.action || '');

  const canRetry = action.indexOf('get') === 0;
  const maxAttempts = canRetry ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        redirect: 'follow'
      });

      const text = await res.text();
      const trimmed = String(text || '').trim();

      if (!res.ok) {
        throw new Error('SERVER_HTTP_' + res.status);
      }

      if (
        trimmed.charAt(0) === '<' ||
        /^<!doctype html/i.test(trimmed) ||
        /^<html/i.test(trimmed)
      ) {
        console.error('API returned HTML instead of JSON', {
          action: action,
          status: res.status,
          response: trimmed.slice(0, 500)
        });

        throw new Error('SERVER_RETURNED_HTML');
      }

      let result;

      try {
        result = JSON.parse(trimmed);
      } catch (parseError) {
        console.error('Invalid API response', {
          action: action,
          status: res.status,
          response: trimmed.slice(0, 500)
        });

        throw new Error('INVALID_SERVER_RESPONSE');
      }

      return result;

    } catch (err) {
      lastError = err;

      console.error('API request failed', {
        action: action,
        attempt: attempt,
        maxAttempts: maxAttempts,
        error: err
      });

      if (attempt < maxAttempts) {
        await waitBeforeRetry(attempt);
      }
    }
  }

  const errorText = String(
    lastError && lastError.message
      ? lastError.message
      : lastError || ''
  );

  if (
    errorText === 'SERVER_RETURNED_HTML' ||
    errorText.indexOf('SERVER_HTTP_') === 0 ||
    errorText === 'INVALID_SERVER_RESPONSE' ||
    errorText.indexOf('Failed to fetch') !== -1 ||
    errorText.indexOf('NetworkError') !== -1
  ) {
    return {
      success: false,
      message:
        'ระบบเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณารอสักครู่แล้วกดลองใหม่'
    };
  }

  return {
    success: false,
    message:
      errorText ||
      'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'
  };
}

function waitBeforeRetry(attempt) {
  const delay = attempt === 1 ? 800 : 1600;

  return new Promise(function(resolve) {
    setTimeout(resolve, delay);
  });
}

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUid = profile.userId;

        document.getElementById('dateInput').value =
  todayText();

        const access = await callApi({
          action: 'getDashboardAccess',
          line_uid: lineUid
        });

        if (!access.success) {
          document.getElementById('accessInfo').innerText = 'ไม่มีสิทธิ์ใช้งาน';
          showError(access.message || 'คุณไม่มีสิทธิ์ดูหน้านี้');
          return;
        }

        dashboardAccess = access;
        setupDashboardAccess(access);

      } catch (err) {
        showError(err.message || err);
      }
    }

    function setupDashboardAccess(access) {
      const branchSelect = document.getElementById('branchSelect');

      document.getElementById('accessInfo').innerHTML =
        'สิทธิ์: ' + access.role + '<br>สาขา: ' + (access.branch_id || '-');

      if (access.access_level === 'ALL') {
        branchSelect.disabled = false;
        document.getElementById('app').innerHTML =
          '<div class="card empty">กรุณาเลือกสาขาเพื่อดูสถานะพนักงาน</div>';
        return;
      }

      if (access.access_level === 'BRANCH') {
        branchSelect.value = access.branch_id;
        branchSelect.disabled = true;
        loadDashboard();
      }
    }

    async function loadDashboard() {
      let branchId = document.getElementById('branchSelect').value;

      if (dashboardAccess && dashboardAccess.access_level === 'BRANCH') {
        branchId = dashboardAccess.branch_id;
      }

      if (!branchId) {
        alert('กรุณาเลือกสาขา');
        return;
      }

      const app = document.getElementById('app');
      app.innerHTML = '<div class="card loading">กำลังโหลดข้อมูล...</div>';

      try {
        const date = document.getElementById('dateInput').value;

        const res = await callApi({
          action: 'getBranchAttendanceDashboard',
          branch_id: branchId,
          date: date
        });

        if (!res.success) {
          showError(res.message || 'โหลดข้อมูลไม่สำเร็จ');
          return;
        }

        renderDashboard(res);

      } catch (err) {
        showError(err.message || err);
      }
    }

    function renderDashboard(res) {
      const app = document.getElementById('app');
      const s = res.summary || {};

      const rows = (res.rows || []).map(function(row) {
        return `
          <div class="row">
            <div class="name">
              ${row.nickname || '-'}
              <span style="font-size:13px;color:#888;">${row.employee_code}</span>
            </div>

            <div class="meta">
              ${row.full_name || ''}<br>
              ตารางงาน: ${row.scheduled_in || '-'} - ${row.scheduled_out || '-'}<br>
              รายการล่าสุด: ${translateAction(row.last_action) || '-'}<br>
              เวลา: ${formatTime(row.last_action_time)}<br>
              มาสาย: ${row.late_minutes || 0} นาที<br>
              HOT: ${row.hot_credit || 0}
            </div>

            <div class="status ${row.current_status}">
              ${translateStatus(row.current_status)}
            </div>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <div class="card">
          <div class="title">${res.branch_id}</div>
          <div class="sub">วันที่ ${formatDate(res.date)}</div>

          <div class="summary">
  <div class="box">
    <div class="num">${s.WORKING || 0}</div>
    <div class="label">กำลังทำงาน</div>
  </div>

  <div class="box">
    <div class="num">${s.ON_BREAK || 0}</div>
    <div class="label">พักอยู่</div>
  </div>

  <div class="box">
    <div class="num">${s.NOT_CHECKED_IN || 0}</div>
    <div class="label">ยังไม่เข้างาน</div>
  </div>

  <div class="box">
    <div class="num">${s.CHECKED_OUT || 0}</div>
    <div class="label">ออกงานแล้ว</div>
  </div>

  <div class="box">
    <div class="num">${s.LEAVE || 0}</div>
    <div class="label">ลาวันนี้</div>
  </div>

  <div class="box">
    <div class="num">${s.OFF || 0}</div>
    <div class="label">หยุดวันนี้</div>
  </div>

  <div class="box">
    <div class="num">${s.LATE || 0}</div>
    <div class="label">มาสาย</div>
  </div>

  <div class="box">
    <div class="num">${s.HOT || 0}</div>
    <div class="label">ได้ HOT</div>
  </div>
</div>
        </div>

        ${rows || '<div class="card empty">ไม่พบพนักงานในสาขานี้</div>'}
      `;
    }

    function translateStatus(status) {
      const map = {
        NOT_CHECKED_IN: 'ยังไม่เข้างาน',
        WORKING: 'กำลังทำงาน',
        ON_BREAK: 'กำลังพัก',
        CHECKED_OUT: 'ออกงานแล้ว',
        MISSING_CHECKOUT: 'ยังไม่ได้เช็คเอาท์',
        LEAVE: 'ลา',
        OFF: 'วันหยุด'
      };

      return map[status] || status || '-';
    }

    function translateAction(action) {
      const map = {
        CHECK_IN: 'เช็คอิน',
        BREAK_OUT: 'ไปพัก',
        BREAK_IN: 'กลับจากพัก',
        CHECK_OUT: 'ออกงาน'
      };

      return map[action] || action || '-';
    }

    function formatTime(value) {
      if (!value) return '-';

      const d = new Date(value);
      if (isNaN(d.getTime())) return value;

      return d.toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatDate(value) {
  if (!value) return '-';

  const d = parseDateOnly(value);

  if (!d) {
    return String(value);
  }

  return d.toLocaleDateString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

    function showError(message) {
      document.getElementById('app').innerHTML =
        '<div class="card error">' + message + '</div>';
    }

    function todayText() {
  const d = new Date();

  const year = d.getFullYear();
  const month =
    String(d.getMonth() + 1).padStart(2, '0');
  const day =
    String(d.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

function parseDateOnly(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return isNaN(value.getTime())
      ? null
      : new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate(),
          12, 0, 0, 0
        );
  }

  const text = String(value).trim();

  const match = text.match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12, 0, 0, 0
    );
  }

  const fallback = new Date(text);

  return isNaN(fallback.getTime())
    ? null
    : fallback;
}

    main();
  </script>
</body>
</html>
