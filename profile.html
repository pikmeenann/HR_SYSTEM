<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Profile</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #2f2f2f;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      margin-bottom: 14px;
    }

    .hello {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .sub {
      color: #777;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .info {
      background: #eef6e8;
      border-radius: 18px;
      padding: 14px;
      line-height: 1.8;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .box {
      background: #fff7e8;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .num {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .label {
      font-size: 13px;
      color: #666;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .error {
      background: #fff0f0;
      color: #a33;
      border-radius: 16px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      font-weight: 800;
      background: #7fb069;
      color: white;
      margin-top: 14px;
    }

    .grid.profile-kpi {
      grid-template-columns: 1fr 1fr;
    }

    .box.late-box {
      background: #ffe2e2;
    }
    
    .absent-box {
      background: #ffe2e2;
    }
    
    .btn-sub {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      opacity: 0.9;
    }
    
  </style>
</head>

<body>
  <div class="wrap">
    <div id="app" class="card">
      <div class="loading">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010317944-KmmsVa0F';

    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

    let lineUid = '';

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUid = profile.userId;

        const res = await callApi({
          action: 'getMyProfile',
          line_uid: lineUid
        });

        if (!res.success) {
          showError(res.message || 'โหลดข้อมูลไม่สำเร็จ');
          return;
        }

        renderProfile(res);

      } catch (err) {
        showError(err.message || err);
      }
    }

async function callApi(payload) {
  const action = String(payload && payload.action || '');

  const canRetry = action.indexOf('get') === 0;
  const maxAttempts = canRetry ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        redirect: 'follow'
      });

      const text = await res.text();
      const trimmed = String(text || '').trim();

      if (!res.ok) {
        throw new Error('SERVER_HTTP_' + res.status);
      }

      if (
        trimmed.charAt(0) === '<' ||
        /^<!doctype html/i.test(trimmed) ||
        /^<html/i.test(trimmed)
      ) {
        console.error('API returned HTML instead of JSON', {
          action: action,
          status: res.status,
          response: trimmed.slice(0, 500)
        });

        throw new Error('SERVER_RETURNED_HTML');
      }

      try {
        return JSON.parse(trimmed);
      } catch (err) {
        throw new Error('INVALID_SERVER_RESPONSE');
      }

    } catch (err) {
      lastError = err;

      console.error('API request failed', {
        action: action,
        attempt: attempt,
        maxAttempts: maxAttempts,
        error: err
      });

      if (attempt < maxAttempts) {
        await waitBeforeRetry(attempt);
      }
    }
  }

  const errorText = String(
    lastError && lastError.message
      ? lastError.message
      : lastError || ''
  );

  if (
    errorText === 'SERVER_RETURNED_HTML' ||
    errorText.indexOf('SERVER_HTTP_') === 0 ||
    errorText === 'INVALID_SERVER_RESPONSE' ||
    errorText.indexOf('Failed to fetch') !== -1 ||
    errorText.indexOf('NetworkError') !== -1
  ) {
    return {
      success: false,
      message:
        'ระบบเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณารอสักครู่แล้วกดลองใหม่'
    };
  }

  return {
    success: false,
    message:
      errorText ||
      'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'
  };
}

function waitBeforeRetry(attempt) {
  const delay = attempt === 1 ? 800 : 1600;

  return new Promise(function(resolve) {
    setTimeout(resolve, delay);
  });
}

    function renderProfile(res) {
      const p = res.profile || {};
      const l = res.leave_balance || {};
      const charges = res.charges || [];
      const app = document.getElementById('app');

      app.innerHTML = `
        <div class="hello">สวัสดี ${p.nickname || ''}</div>
        <div class="sub">ข้อมูลพนักงานของฉัน</div>

        <div class="info">
          รหัสพนักงาน: <b>${p.employee_code || '-'}</b><br>
          ชื่อ: ${p.first_name || ''} ${p.last_name || ''}<br>
          สาขา: ${p.branch_name || p.branch_id || '-'}<br>
          ตำแหน่ง: ${p.position || '-'}<br>
          เริ่มงาน: ${formatDate(p.start_date)}<br>
          อายุงาน: ${p.service_age_text || '-'}
        </div>

        <br>

        <div class="grid profile-kpi">

  <div class="box">
    <div class="num">${l.sick_remaining || 0}</div>
    <div class="label">ลาป่วยคงเหลือ</div>
  </div>

  <div class="box">
    <div class="num">${l.vacation_remaining || 0}</div>
    <div class="label">พักร้อนคงเหลือ</div>
  </div>

  <div class="box late-box">
    <div class="num">${p.late_count_current_period || 0}</div>
    <div class="label">
      มาสาย<br>รอบปีนี้
      ${p.late_minutes_current_period ? '<br>รวม ' + p.late_minutes_current_period + ' นาที' : ''}
    </div>
  </div>

  <div class="box absent-box">
    <div class="num">${p.over_absent_count_this_year || 0}</div>
    <div class="label">หยุดเกิน<br>รอบปีนี้</div>
  </div>

</div>
        ${renderCharges(charges)}
        <button class="btn" onclick="openContact()">
          📞 ข้อมูลติดต่อและบุคคลฉุกเฉิน
          <span class="btn-sub">
            ${p.contact_complete ? '🟢 ข้อมูลครบถ้วนแล้ว' : '🟠 กรุณากรอกข้อมูลให้ครบ'}
          </span>
        </button>

        <button class="btn" onclick="openAttendanceHistory()">
        🕒 ประวัติการเข้างาน
        </button>

        <button class="btn" onclick="openLeaveHistory()">
        📋 ประวัติการลา
        </button>

      `;
    }

    function parseDateOnly(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return isNaN(value.getTime())
      ? null
      : new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate(),
          12, 0, 0, 0
        );
  }

  const text = String(value).trim();

  const match = text.match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12, 0, 0, 0
    );
  }

  const fallback = new Date(text);

  return isNaN(fallback.getTime())
    ? null
    : fallback;
}

function formatDate(value) {
  if (!value) return '-';

  const d = parseDateOnly(value);

  if (!d) {
    return String(value);
  }

  return d.toLocaleDateString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

function renderCharges(charges) {

  if (!charges.length) {
    return `
      <div class="card">
        <b>💰 ค่าใช้จ่ายที่มีผลผูกพัน</b><br><br>
        ไม่มีรายการ
      </div>
    `;
  }

  let html = `
    <div class="card">
      <b>💰 ค่าใช้จ่ายที่มีผลผูกพัน</b><br><br>
  `;

  charges.forEach(function(c) {

    html += `
      <div style="
        border:1px solid #eee;
        border-radius:12px;
        padding:10px;
        margin-bottom:10px;
      ">
        <b>${c.charge_name || c.charge_type}</b><br>

        จำนวนเงิน:
        ${Number(c.amount || 0).toLocaleString()} บาท
        <br>

        วันที่รายการ:
        ${formatDate(c.charge_event_date)}
        <br>

        ครบกำหนด:
        ${formatDate(c.expiry_date)}
      </div>
    `;
  });

  html += '</div>';

  return html;
}
    
    function showError(message) {
      document.getElementById('app').innerHTML = `
        <div class="error">${message}</div>
      `;
    }

    function openContact() {
      window.location.href = 'https://liff.line.me/2010317944-VaiuSU2q';
    }

    function openAttendanceHistory() {
      window.location.href = 'https://liff.line.me/2010317944-JFsW8yLs';
    }

    function openLeaveHistory() {
      window.location.href = 'https://liff.line.me/2010317944-2vwp7PAW';
    }
    
    main();
  </script>
</body>
</html>
