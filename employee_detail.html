<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Employee Detail</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #2f2f2f;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      margin-bottom: 14px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub, .meta {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .info {
      background: #eef6e8;
      border-radius: 18px;
      padding: 14px;
      line-height: 1.8;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .box {
      background: #fff7e8;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .num {
      font-size: 26px;
      font-weight: 800;
    }

    .label {
      font-size: 13px;
      color: #666;
    }

    .row {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
      font-size: 14px;
      line-height: 1.7;
    }

    .pill {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef6e8;
      color: #477a37;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }

    .loading,
    .error,
    .empty {
      text-align: center;
      padding: 32px 10px;
      color: #777;
    }

    .error {
      color: #a33;
      background: #fff0f0;
      border-radius: 16px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      background: #7fb069;
      color: #fff;
      margin-top: 10px;
    }

    .btn-danger {
  width: 100%;
  border: none;
  border-radius: 18px;
  padding: 14px;
  font-size: 16px;
  font-weight: 800;
  background: #c94c4c;
  color: #fff;
  margin-top: 10px;
  cursor: pointer;
}

.btn-danger:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.form-group {
  margin-top: 14px;
}

.form-label {
  display: block;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 6px;
}

.form-control {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 12px;
  font-size: 15px;
  background: #fff;
}

.resign-box {
  background: #fff3f3;
  border-radius: 18px;
  padding: 14px;
  margin-top: 12px;
}

.warning-text {
  color: #a33;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 8px;
}
  </style>
</head>

<body>
  <div class="wrap">
    <div id="app">
      <div class="card loading">กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010317944-Iu21jArf';

    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

    let lineUid = '';
let currentEmployee = null;

async function callApi(payload) {
  const action = String(payload && payload.action || '');

  const canRetry = action.indexOf('get') === 0;
  const maxAttempts = canRetry ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        redirect: 'follow'
      });

      const text = await res.text();
      const trimmed = String(text || '').trim();

      if (!res.ok) {
        throw new Error('SERVER_HTTP_' + res.status);
      }

      if (
        trimmed.charAt(0) === '<' ||
        /^<!doctype html/i.test(trimmed) ||
        /^<html/i.test(trimmed)
      ) {
        console.error('API returned HTML instead of JSON', {
          action: action,
          status: res.status,
          response: trimmed.slice(0, 500)
        });

        throw new Error('SERVER_RETURNED_HTML');
      }

      try {
        return JSON.parse(trimmed);
      } catch (err) {
        throw new Error('INVALID_SERVER_RESPONSE');
      }

    } catch (err) {
      lastError = err;

      console.error('API request failed', {
        action: action,
        attempt: attempt,
        maxAttempts: maxAttempts,
        error: err
      });

      if (attempt < maxAttempts) {
        await waitBeforeRetry(attempt);
      }
    }
  }

  const errorText = String(
    lastError && lastError.message
      ? lastError.message
      : lastError || ''
  );

  if (
    errorText === 'SERVER_RETURNED_HTML' ||
    errorText.indexOf('SERVER_HTTP_') === 0 ||
    errorText === 'INVALID_SERVER_RESPONSE' ||
    errorText.indexOf('Failed to fetch') !== -1 ||
    errorText.indexOf('NetworkError') !== -1
  ) {
    return {
      success: false,
      message:
        'ระบบเชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณารอสักครู่แล้วกดลองใหม่'
    };
  }

  return {
    success: false,
    message:
      errorText ||
      'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่'
  };
}

function waitBeforeRetry(attempt) {
  const delay = attempt === 1 ? 800 : 1600;

  return new Promise(function(resolve) {
    setTimeout(resolve, delay);
  });
}

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUid = profile.userId;

        const employeeCode = getQueryParam('employee_code');

        if (!employeeCode) {
          showError('ไม่พบรหัสพนักงาน');
          return;
        }

        const res = await callApi({
          action: 'getEmployeeDetail',
          line_uid: lineUid,
          employee_code: employeeCode
        });

        if (!res.success) {
          showError(res.message || 'โหลดข้อมูลไม่สำเร็จ');
          return;
        }

        renderDetail(res);

      } catch (err) {
        showError(err.message || err);
      }
    }

    function renderDetail(res) {
      const e = res.employee || {};
      const l = res.leave_balance || {};
        currentEmployee = e;
      const schedules = res.next_schedules || [];
      const attendance = res.recent_attendance || [];

      const app = document.getElementById('app');

      app.innerHTML = `
        <div class="card">
          <div class="title">👤 ${e.nickname || '-'}</div>
          <div class="sub">${e.employee_code || '-'} · ${e.branch_id || '-'}</div>

          <div class="info">
            ชื่อ: ${e.full_name || '-'}<br>
            ตำแหน่ง: ${e.position || '-'}<br>
            Role: ${e.role || '-'}<br>
            สถานะ: ${e.employment_status || '-'} / ${e.status || '-'}<br>
            เริ่มงาน: ${formatDate(e.start_date)}<br>
            วันผ่านโปร: ${formatDate(e.probation_end_date)}
          </div>
        </div>

        <div class="card">
          <div class="section-title">สิทธิ์ลา</div>

          <div class="grid">
            <div class="box">
              <div class="num">${l.sick_remaining || 0}</div>
              <div class="label">ลาป่วยคงเหลือ</div>
            </div>

            <div class="box">
              <div class="num">${l.vacation_remaining || 0}</div>
              <div class="label">พักร้อนคงเหลือ</div>
            </div>

            <div class="box">
              <div class="num">${l.personal_remaining || 0}</div>
              <div class="label">ลากิจคงเหลือ</div>
            </div>

            <div class="box">
              <div class="num">${l.hot_balance || 0}</div>
              <div class="label">HOT คงเหลือ</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">ตารางงานถัดไป</div>
          ${renderSchedules(schedules)}
        </div>

        <div class="card">
        <div class="section-title">ประวัติเข้างานล่าสุด</div>
        ${renderAttendance(attendance)}
      </div>

      ${renderEmployeeManagement(e, res)}

      <button class="btn" onclick="history.back()">กลับ</button>
      `;
    }

    function renderEmployeeManagement(employee, res) {
  const canManage =
    res.can_manage_employee === true;

  if (!canManage) {
    return '';
  }

const isResigned =
  String(employee.employment_status || '')
    .trim()
    .toUpperCase() === 'RESIGNED';

  if (isResigned) {
    return `
      <div class="card">
        <div class="section-title">จัดการพนักงาน</div>

        <div class="resign-box">
          <b>พนักงานลาออกแล้ว</b><br>
          วันทำงานวันสุดท้าย:
          ${formatDate(employee.resign_date)}<br>
          เหตุผล:
          ${employee.resign_reason || '-'}
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="section-title">จัดการพนักงาน</div>

      <button
        class="btn-danger"
        onclick="showResignForm()"
      >
        บันทึกพนักงานลาออก
      </button>

      <div
        id="resignForm"
        class="resign-box"
        style="display:none;"
      >
        <div class="form-group">
          <label class="form-label">
            วันทำงานวันสุดท้าย
          </label>

          <input
            type="date"
            id="resignDate"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label class="form-label">
            เหตุผลที่ลาออก
          </label>

<select
  id="resignReason"
  class="form-control"
>
  <option value="">-- เลือกเหตุผล --</option>
  <option value="ลาออกเอง">ลาออกเอง</option>
  <option value="ไม่ผ่านทดลองงาน">ไม่ผ่านทดลองงาน</option>
  <option value="เลิกจ้าง">เลิกจ้าง</option>
  <option value="หมดสัญญา">หมดสัญญา</option>
  <option value="กลับประเทศ">กลับประเทศ</option>
  <option value="อื่นๆ">อื่นๆ</option>
</select>
        </div>

        <div class="warning-text">
          เมื่อยืนยันแล้ว สถานะพนักงานจะถูกเปลี่ยนเป็น
          RESIGNED / INACTIVE และพนักงานจะไม่สามารถ
          เช็กอินเข้าสู่ระบบได้
        </div>

        <button
          id="confirmResignBtn"
          class="btn-danger"
          onclick="submitResignation()"
        >
          ยืนยันการลาออก
        </button>

        <button
          class="btn"
          onclick="hideResignForm()"
        >
          ยกเลิก
        </button>
      </div>
    </div>
  `;
}

    function showResignForm() {
  const form = document.getElementById('resignForm');

  if (!form) return;

  form.style.display = 'block';
}

    function hideResignForm() {
  const form = document.getElementById('resignForm');

  if (!form) return;

  form.style.display = 'none';

  const dateInput =
    document.getElementById('resignDate');

  const reasonInput =
    document.getElementById('resignReason');

  if (dateInput) {
    dateInput.value = '';
  }

  if (reasonInput) {
    reasonInput.value = '';
  }
}

    async function submitResignation() {
  if (window.isResigning) return;

  if (!currentEmployee) {
    alert('ไม่พบข้อมูลพนักงาน');
    return;
  }

  const resignDate =
    document.getElementById('resignDate').value;

  const resignReason =
    document.getElementById('resignReason').value;

  if (!resignDate) {
    alert('กรุณาระบุวันทำงานวันสุดท้าย');
    return;
  }

  if (!resignReason) {
    alert('กรุณาเลือกเหตุผลลาออก');
    return;
  }

  const employeeName =
    currentEmployee.nickname ||
    currentEmployee.full_name ||
    currentEmployee.employee_code;

  const confirmed = confirm(
    'ยืนยันบันทึกลาออกให้ ' +
    employeeName +
    ' ?\n\n' +
    'วันทำงานวันสุดท้าย: ' +
    formatDate(resignDate) +
    '\n' +
    'เหตุผล: ' +
    resignReason +
    '\n\n' +
    'หลังยืนยัน พนักงานจะถูกตัดสิทธิ์การใช้งานระบบทันที'
  );

  if (!confirmed) {
    return;
  }

  window.isResigning = true;

  const button =
    document.getElementById('confirmResignBtn');

  if (button) {
    button.disabled = true;
    button.textContent =
      'กำลังบันทึก...';
  }

  try {
    const res = await callApi({
      action: 'resignEmployee',

      data: {
        line_uid: lineUid,
        employee_code:
          currentEmployee.employee_code,
        resign_date: resignDate,
        resign_reason: resignReason
      }
    });

    if (!res.success) {
      alert(
        res.message ||
        'บันทึกการลาออกไม่สำเร็จ'
      );
      return;
    }

    alert(
      res.message ||
      'บันทึกพนักงานลาออกเรียบร้อยแล้ว'
    );

    await reloadEmployeeDetail();

  } catch (err) {
    alert(
      err.message ||
      'เกิดข้อผิดพลาดในการบันทึก'
    );

  } finally {
    window.isResigning = false;

    if (button) {
      button.disabled = false;
      button.textContent =
        'ยืนยันการลาออก';
    }
  }
}

    async function reloadEmployeeDetail() {
  const employeeCode =
    currentEmployee &&
    currentEmployee.employee_code;

  if (!employeeCode) {
    window.location.reload();
    return;
  }

  const res = await callApi({
    action: 'getEmployeeDetail',
    line_uid: lineUid,
    employee_code: employeeCode
  });

  if (!res.success) {
    showError(
      res.message ||
      'โหลดข้อมูลพนักงานใหม่ไม่สำเร็จ'
    );
    return;
  }

  renderDetail(res);
}

    function renderSchedules(list) {
      if (!list.length) {
        return '<div class="empty">ยังไม่มีตารางงานถัดไป</div>';
      }

      return list.map(function(s) {
        const shift = String(s.shift_name || '');

        let detail = '';

        if (shift === 'OFF') {
          detail = 'วันหยุด';
        } else if (shift === 'LEAVE') {
          detail = 'ลา';
        } else {
          detail =
            'เวลา: ' + (s.start_time || '-') + ' - ' + (s.end_time || '-') + '<br>' +
            'สาขา: ' + (s.branch_id || '-');
        }

        return `
          <div class="row">
            <b>${formatDate(s.date)}</b><br>
            ${detail}
            ${s.note ? '<br>หมายเหตุ: ' + s.note : ''}
          </div>
        `;
      }).join('');
    }

    function renderAttendance(list) {
      if (!list.length) {
        return '<div class="empty">ยังไม่มีประวัติสรุปการเข้างาน</div>';
      }

      return list.map(function(a) {
        return `
          <div class="row">
            <b>${formatDate(a.date)}</b><br>
            เวลาเข้างาน: ${a.actual_in || '-'}<br>
            เวลาออกงาน: ${a.actual_out || '-'}<br>
            มาสาย: ${a.late_minutes || 0} นาที<br>
            OT: ${a.ot_minutes || 0} นาที
            <div class="pill">${translateAttendanceStatus(a.attendance_status)}</div>
          </div>
        `;
      }).join('');
    }

    function translateAttendanceStatus(status) {
      const map = {
        PRESENT: 'มาทำงาน',
        ABSENT: 'ขาดงาน',
        LEAVE: 'ลา',
        OFF: 'วันหยุด'
      };

      return map[status] || status || '-';
    }

    function parseDateOnly(value) {
  if (!value) return null;

  if (value instanceof Date) {
    return isNaN(value.getTime())
      ? null
      : new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate(),
          12, 0, 0, 0
        );
  }

  const text = String(value).trim();

  const match = text.match(
    /^(\d{4})-(\d{2})-(\d{2})$/
  );

  if (match) {
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12, 0, 0, 0
    );
  }

  const fallback = new Date(text);

  return isNaN(fallback.getTime())
    ? null
    : fallback;
}

function formatDate(value) {
  if (!value) return '-';

  const d = parseDateOnly(value);

  if (!d) {
    return String(value);
  }

  return d.toLocaleDateString('th-TH', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function showError(message) {
      document.getElementById('app').innerHTML =
        '<div class="card error">' + message + '</div>';
    }

    main();
  </script>
</body>
</html>
