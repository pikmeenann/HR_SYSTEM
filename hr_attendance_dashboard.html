<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HR Attendance Dashboard</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3e8;
      color: #2f2f2f;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      background: #fff;
      margin-top: 12px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      background: #7fb069;
      color: #fff;
      margin-top: 12px;
    }

    .mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}

.mode-btn {
  border: none;
  border-radius: 14px;
  padding: 12px 8px;
  font-size: 14px;
  font-weight: 800;
  background: #eeeeee;
  color: #666;
  cursor: pointer;
}

.mode-btn.active {
  background: #7fb069;
  color: #fff;
}

    .branch {
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .branch-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .branch-sub {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .box {
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      background: #eef6e8;
    }

    .box.orange { background: #fff0d6; }
    .box.red { background: #ffe2e2; }
    .box.blue { background: #e6f1ff; }
    .box.purple { background: #eee8ff; }

    .num {
      font-size: 24px;
      font-weight: 800;
    }

    .label {
      font-size: 12px;
      color: #666;
    }

    .summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
  margin-bottom: 14px;
}

.summary-box {
  background: #eef6e8;
  border-radius: 16px;
  padding: 12px;
  text-align: center;
}

.summary-box.orange {
  background: #fff0d6;
}

.summary-box.red {
  background: #ffe2e2;
}

.summary-box.blue {
  background: #e6f1ff;
}

.summary-box.purple {
  background: #eee8ff;
}

    .employee-calendar-card {
  overflow: hidden;
}

.employee-header {
  margin-bottom: 14px;
}

.employee-name {
  font-size: 20px;
  font-weight: 800;
}

.employee-meta {
  margin-top: 4px;
  font-size: 13px;
  color: #777;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border: 1px solid #ddd;
  border-radius: 16px;
  overflow: hidden;
  width: 100%;
  margin-top: 12px;
}

.day-head {
  background: #eef6e8;
  padding: 8px 2px;
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  border-right: 1px solid #ddd;
}

.day-cell {
  height: 86px;
  min-width: 0;
  padding: 6px 3px;
  border-top: 1px solid #ddd;
  border-right: 1px solid #ddd;
  font-size: 10px;
  background: #fff;
  overflow: hidden;
  position: relative;
}

.day-cell.present {
  background: #f4fbf0;
}

.day-cell.late {
  background: #fff0d6;
  color: #9a5a00;
}

.day-cell.empty-cell {
  background: #fafafa;
}

.day-cell.today {
  border: 2px solid #2f6b2f;
  box-shadow: inset 0 0 0 1px #2f6b2f;
}

.today-tag {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  background: #2f6b2f;
  border-radius: 50%;
}

.day-num {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 5px;
}

.time-line {
  font-size: 10px;
  line-height: 1.3;
  word-break: keep-all;
}

.late-text {
  color: #b05a00;
  font-weight: 800;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 13px;
  color: #666;
  margin-top: 14px;
  margin-bottom: 12px;
}

.dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 4px;
}

.dot.present {
  background: #dff2d7;
}

.dot.late {
  background: #fff0d6;
}

.dot.none {
  background: #fafafa;
  border: 1px solid #ddd;
}

.day-cell.off {
  background: #ffe2e2;
}

.day-cell.hot {
  background: #e4f6df;
}

.day-cell.off .day-num {
  color: #b22222;
}

.day-cell.hot .day-num {
  color: #2f8f2f;
}

.day-cell.missing {
  background: #fff7cc;
}

    .day-cell.leave {
  background: #e6f1ff;
  color: #285b91;
}

.day-cell.absent {
  background: #ffe2e2;
  color: #a12626;
}
    
    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 32px 10px;
      color: #777;
    }

    .error {
      color: #a33;
      background: #fff0f0;
      border-radius: 16px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="title">ข้อมูลการเข้างาน</div>
      <div class="sub">ตรวจสอบการเข้างานรายวันและรายงวด</div>

      <div class="mode-tabs">
  <button
    id="dailyTab"
    class="mode-btn active"
    onclick="switchMode('daily')"
  >
    สรุปรายวัน
  </button>

  <button
    id="periodTab"
    class="mode-btn"
    onclick="switchMode('period')"
  >
    ปฏิทินทั้งงวด
  </button>
</div>

<div id="dailyFilters">
  <input id="dateInput" class="input" type="date">

  <button class="btn" onclick="loadDashboard()">
    ดู Dashboard
  </button>
</div>

<div id="periodFilters" style="display:none;">
  <select id="branchInput" class="input">
    <option value="">กำลังโหลดสาขา...</option>
  </select>

  <select id="periodInput" class="input">
    <option value="">กำลังโหลดรอบวันที่...</option>
  </select>

  <button class="btn" onclick="loadPeriodCalendars()">
    แสดงข้อมูล
  </button>
</div>

</div>

<div id="app">
  <div class="card loading">กำลังโหลด...</div>
</div>

</div>

<script>
    const LIFF_ID = '2010317944-JT6WkNZ4';

    const GAS_API_URL =
      'https://script.google.com/macros/s/AKfycbzzm6lTF7aMi0ufzas0KV9l6g_ab-_UqCEHFvxe23l3R4DgLMDUDig60HssQg5WqGCN0A/exec';

    let lineUid = '';
    let currentMode = 'daily';

    async function callApi(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      return await res.json();
    }

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUid = profile.userId;

        document.getElementById('dateInput').value = todayText();

        await loadDashboard();

      } catch (err) {
        showError(err.message || err);
      }
    }

    async function loadDashboard() {
      const dateText = document.getElementById('dateInput').value;
      const app = document.getElementById('app');

      app.innerHTML = '<div class="card loading">กำลังโหลดข้อมูล...</div>';

      try {
        const res = await callApi({
          action: 'getHrAttendanceDailySummary',
          line_uid: lineUid,
          date: dateText
        });

        if (!res.success) {
          showError(res.message || 'โหลดข้อมูลไม่สำเร็จ');
          return;
        }

        renderDashboard(res);

      } catch (err) {
        showError(err.message || err);
      }
    }

    function renderDashboard(res) {
      const app = document.getElementById('app');
      const rows = res.rows || [];

      if (!rows.length) {
        app.innerHTML =
          '<div class="card empty">ยังไม่มีข้อมูลสรุปของวันนี้</div>';
        return;
      }

      app.innerHTML = `
        <div class="card">
          <div class="title">${formatDate(res.date)}</div>
          <div class="sub">จำนวนสาขาที่มีตารางงาน: ${rows.length}</div>
        </div>

        ${rows.map(renderBranch).join('')}
      `;
    }

    function renderBranch(row) {
      return `
        <div class="branch">
          <div class="branch-title">${row.branch_name || row.branch_id}</div>
          <div class="branch-sub">${row.branch_id}</div>

          <div class="grid">
            <div class="box">
              <div class="num">${row.total || 0}</div>
              <div class="label">ทั้งหมด</div>
            </div>

            <div class="box">
              <div class="num">${row.present || 0}</div>
              <div class="label">มาทำงาน</div>
            </div>

            <div class="box red">
              <div class="num">${row.absent || 0}</div>
              <div class="label">ขาดงาน</div>
            </div>

            <div class="box orange">
              <div class="num">${row.late || 0}</div>
              <div class="label">มาสาย</div>
            </div>

            <div class="box purple">
              <div class="num">${row.leave || 0}</div>
              <div class="label">ลา</div>
            </div>

            <div class="box blue">
              <div class="num">${row.off || 0}</div>
              <div class="label">หยุด</div>
            </div>

            <div class="box orange">
              <div class="num">${row.hot || 0}</div>
              <div class="label">ได้ HOT</div>
            </div>
          </div>
        </div>
      `;
    }

    function todayText() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');

      return y + '-' + m + '-' + day;
    }

    function formatDate(value) {
      if (!value) return '-';

      const d = new Date(value);
      if (isNaN(d.getTime())) return value;

      return d.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function showError(message) {
      document.getElementById('app').innerHTML =
        '<div class="card error">' + message + '</div>';
    }

    function switchMode(mode) {
  currentMode = mode;

  const dailyTab = document.getElementById('dailyTab');
  const periodTab = document.getElementById('periodTab');
  const dailyFilters = document.getElementById('dailyFilters');
  const periodFilters = document.getElementById('periodFilters');
  const app = document.getElementById('app');

  if (mode === 'daily') {
    dailyTab.classList.add('active');
    periodTab.classList.remove('active');

    dailyFilters.style.display = 'block';
    periodFilters.style.display = 'none';

    loadDashboard();
    return;
  }

  dailyTab.classList.remove('active');
  periodTab.classList.add('active');

  dailyFilters.style.display = 'none';
  periodFilters.style.display = 'block';

  app.innerHTML =
    '<div class="card empty">กรุณาเลือกสาขาและรอบวันที่</div>';

  loadPeriodFilterOptions();
}

    async function loadPeriodFilterOptions() {
  const branchInput = document.getElementById('branchInput');
  const periodInput = document.getElementById('periodInput');

  branchInput.innerHTML =
    '<option value="">กำลังโหลดสาขา...</option>';

  periodInput.innerHTML =
    '<option value="">กำลังโหลดรอบวันที่...</option>';

  try {
    const res = await callApi({
      action: 'getHrAttendancePeriodFilterOptions',
      line_uid: lineUid
    });

    if (!res.success) {
      showError(res.message || 'โหลดตัวเลือกไม่สำเร็จ');
      return;
    }

    const branches = res.branches || [];
    const periods = res.periods || [];

    if (!branches.length) {
  branchInput.innerHTML =
    '<option value="">ไม่พบสาขาที่เข้าถึงได้</option>';
} else {
  branchInput.innerHTML =
    '<option value="">เลือกสาขา</option>' +
    branches.map(function(branch) {
      return `
        <option value="${escapeHtml(branch.branch_id)}">
          ${escapeHtml(
            branch.branch_name ||
            branch.branch_id
          )}
        </option>
      `;
    }).join('');
}

    if (!periods.length) {
  periodInput.innerHTML =
    '<option value="">ไม่พบข้อมูลรอบวันที่</option>';
} else {
  periodInput.innerHTML =
    periods.map(function(period) {
      return `
        <option value="${escapeHtml(period.payroll_period)}">
          ${escapeHtml(period.display_text)}
        </option>
      `;
    }).join('');
}

  } catch (err) {
    showError(err.message || err);
  }
}

    async function loadPeriodCalendars() {
  const branchId =
    document.getElementById('branchInput').value;

  const payrollPeriod =
    document.getElementById('periodInput').value;

  const app = document.getElementById('app');

  if (!branchId) {
    showError('กรุณาเลือกสาขา');
    return;
  }

  if (!payrollPeriod) {
    showError('กรุณาเลือกรอบวันที่');
    return;
  }

  app.innerHTML =
    '<div class="card loading">กำลังโหลดข้อมูลพนักงาน...</div>';

  try {
    const res = await callApi({
      action: 'getHrAttendancePeriodCalendars',
      line_uid: lineUid,
      branch_id: branchId,
      payroll_period: payrollPeriod
    });

    if (!res.success) {
      showError(res.message || 'โหลดข้อมูลไม่สำเร็จ');
      return;
    }

    renderPeriodCalendars(res);

  } catch (err) {
    showError(err.message || err);
  }
}

    function renderPeriodCalendars(res) {
  const app = document.getElementById('app');
  const employees = res.employees || [];

  if (!employees.length) {
    app.innerHTML =
      '<div class="card empty">ไม่พบข้อมูลพนักงานในสาขานี้</div>';
    return;
  }

  app.innerHTML = `
    <div class="card">
      <div class="title">
        ${escapeHtml(res.branch_name || res.branch_id || '')}
      </div>

      <div class="sub">
        รอบ ${escapeHtml(res.period_display || '')}<br>
        พนักงานทั้งหมด ${employees.length} คน
      </div>
    </div>

    ${employees.map(function(employee) {
      return renderEmployeeCalendar(
        employee,
        res.range_start,
        res.range_end
      );
    }).join('')}
  `;
}

    function renderEmployeeCalendar(employee, rangeStart, rangeEnd) {
  const rows = employee.rows || [];
  const summary = employee.summary || {};
  const dailyMap = buildDailyMap(rows);

  return `
    <div class="card employee-calendar-card">
      <div class="employee-header">
        <div class="employee-name">
          ${escapeHtml(
            employee.nickname ||
            employee.employee_name ||
            '-'
          )}
        </div>

        <div class="employee-meta">
          ${escapeHtml(employee.employee_code || '')}
          ·
          ${escapeHtml(employee.position || '')}
        </div>
      </div>

      <div class="summary-grid">
        <div class="summary-box orange">
          <div class="num">
            ${summary.late_count || 0}
          </div>
          <div class="label">
            มาสาย<br>
            ${summary.late_minutes || 0} นาที
          </div>
        </div>

        <div class="summary-box">
          <div class="num">
            ${summary.ot_hours || '0.00'}
          </div>
          <div class="label">
            OT สะสม<br>
            ชั่วโมง
          </div>
        </div>

        <div class="summary-box red">
          <div class="num">
            ${summary.absent_count || 0}
          </div>
          <div class="label">
            ขาดงาน
          </div>
        </div>

        <div class="summary-box blue">
          <div class="num">
            ${summary.leave_count || 0}
          </div>
          <div class="label">
            ลา
          </div>
        </div>
      </div>

      <div class="legend">
        <span>
          <i class="dot present"></i>
          มีบันทึกเวลา
        </span>

        <span>
          <i class="dot late"></i>
          มาสาย
        </span>

        <span>
          <i class="dot none"></i>
          ไม่มีบันทึก
        </span>
      </div>

      ${buildCalendarHtml(
        rangeStart,
        rangeEnd,
        dailyMap,
        summary.by_date || {}
      )}
    </div>
  `;
}

    function buildDailyMap(rows) {
  const map = {};

  rows.forEach(function(row) {
    const dateText = String(row.date || '').trim();

    if (!dateText) return;

    if (!map[dateText]) {
      map[dateText] = {
        date: dateText,
        check_in: '',
        check_out: ''
      };
    }

    if (row.check_type === 'CHECK_IN') {
      if (
        !map[dateText].check_in ||
        new Date(row.datetime) < new Date(map[dateText].check_in)
      ) {
        map[dateText].check_in = row.datetime;
      }
    }

    if (row.check_type === 'CHECK_OUT') {
      if (
        !map[dateText].check_out ||
        new Date(row.datetime) > new Date(map[dateText].check_out)
      ) {
        map[dateText].check_out = row.datetime;
      }
    }
  });

  return map;
}

    function buildCalendarHtml(
  startText,
  endText,
  dailyMap,
  summaryMap
) {
  const weekHeads = [
    'จันทร์',
    'อังคาร',
    'พุธ',
    'พฤหัสบดี',
    'ศุกร์',
    'เสาร์',
    'อาทิตย์'
  ];

  const start = new Date(startText);
  const end = new Date(endText);

  if (isNaN(start.getTime()) || isNaN(end.getTime())) {
    return '<div class="error">รูปแบบวันที่ของรอบไม่ถูกต้อง</div>';
  }

  const first = new Date(start);

  const firstDay = first.getDay();
  const mondayOffset = firstDay === 0
    ? -6
    : 1 - firstDay;

  first.setDate(first.getDate() + mondayOffset);

  let html = '<div class="calendar">';

  weekHeads.forEach(function(dayName) {
    html +=
      '<div class="day-head">' +
      escapeHtml(dayName) +
      '</div>';
  });

  const current = new Date(first);
  const todayDateText = toDateText(new Date());

  while (true) {
    const dateText = toDateText(current);
    const inRange =
      current >= start &&
      current <= end;

    const dayData = dailyMap[dateText] || null;
    const daySummary = summaryMap[dateText] || {};

    const attendanceStatus =
      String(daySummary.attendance_status || '').trim();

    const lateMinutes =
      Number(daySummary.late_minutes || 0);

    let className = 'day-cell';
    let content = '';

    if (!inRange) {
      className += ' empty-cell';
    } else {
      const isToday = dateText === todayDateText;

      content =
        '<div class="day-num">' +
        current.getDate() +
        '</div>';

      if (attendanceStatus === 'OFF') {
        className += ' off';

        content +=
          '<div class="time-line"><b>หยุด</b></div>';
      } else if (attendanceStatus === 'HOT') {
        className += ' hot';

        content +=
          '<div class="time-line"><b>HOT</b></div>';
      } else if (
        attendanceStatus === 'LEAVE' ||
        attendanceStatus === 'SICK' ||
        attendanceStatus === 'VACATION'
      ) {
        className += ' leave';

        content +=
          '<div class="time-line"><b>ลา</b></div>';
      } else if (attendanceStatus === 'ABSENT') {
        className += ' absent';

        content +=
          '<div class="time-line"><b>ขาด</b></div>';
      } else if (dayData && dayData.check_in) {
        const missingCheckout = !dayData.check_out;

        if (missingCheckout) {
          className += ' missing';
        } else if (lateMinutes > 0) {
          className += ' late';
        } else {
          className += ' present';
        }

        content +=
          '<div class="time-line">เข้า ' +
          escapeHtml(formatTime(dayData.check_in)) +
          '</div>';

        if (dayData.check_out) {
  content +=
    '<div class="time-line">ออก ' +
    escapeHtml(formatTime(dayData.check_out)) +
    '</div>';
}

        if (lateMinutes > 0) {
          content +=
            '<div class="time-line late-text">' +
            'สาย ' +
            lateMinutes +
            ' นาที' +
            '</div>';
        }

        if (missingCheckout) {
          content +=
            '<div class="time-line late-text">' +
            'ไม่มีเวลาออก' +
            '</div>';
        }
      }

      if (isToday) {
        className += ' today';
        content += '<div class="today-tag"></div>';
      }
    }

    html +=
      '<div class="' +
      className +
      '">' +
      content +
      '</div>';

    current.setDate(current.getDate() + 1);

    if (current > end && current.getDay() === 1) {
      break;
    }
  }

  html += '</div>';

  return html;
}

    function formatTime(value) {
  if (!value) return '-';

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleTimeString('th-TH', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
}

    function toDateText(date) {
  const year = date.getFullYear();

  const month =
    String(date.getMonth() + 1).padStart(2, '0');

  const day =
    String(date.getDate()).padStart(2, '0');

  return year + '-' + month + '-' + day;
}

    function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

    main();
  </script>
</body>
